// Número do dia (muda à meia-noite) → posição na lista.
// Multiplicar por 7 (que não divide o tamanho da lista) passa por todos
// os versículos antes de repetir, sem seguir a ordem da lista.
function versiculoDoDia(data) {
  data = data || new Date();
  const dia = Math.floor(Date.UTC(data.getFullYear(), data.getMonth(), data.getDate()) / 86400000);
  const total = VERSICULOS.length;
  const passo = total % 7 === 0 ? 11 : 7;
  return VERSICULOS[((dia * passo) % total + total) % total];
}

function mostrarVersiculoDoDia() {
  const caixa = $('versiculoDia');
  if (!caixa) return;
  const versiculo = versiculoDoDia();
  $('versiculoTexto').textContent = versiculo[0];
  $('versiculoReferencia').textContent = versiculo[1];
  caixa.hidden = false;
}

// Tela inicial (restaurante e empresa), depois do login
function mostrarVersiculoInicio() {
  const versiculo = versiculoDoDia();
  document.querySelectorAll('[data-versiculo-inicio]').forEach(function(caixa) {
    caixa.querySelector('[data-versiculo-texto]').textContent = versiculo[0];
    caixa.querySelector('[data-versiculo-referencia]').textContent = versiculo[1];
    caixa.hidden = false;
  });
}

mostrarVersiculoDoDia();
mostrarVersiculoInicio();
</script>
