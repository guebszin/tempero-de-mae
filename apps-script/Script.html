function icone(nome) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (ICONES[nome] || '') + '</svg>';
}

// Troca todo elemento com data-icone="nome" pelo desenho correspondente
function preencherIcones(raiz) {
  (raiz || document).querySelectorAll('[data-icone]').forEach(function(elemento) {
    elemento.innerHTML = icone(elemento.dataset.icone);
  });
}

// ----------------------------------------------------------------
// ATALHOS PARA CRIAR ELEMENTOS
// ----------------------------------------------------------------
function $(id) {
  return document.getElementById(id);
}

function el(tag, classe, texto) {
  const elemento = document.createElement(tag);
  if (classe) elemento.className = classe;
  if (texto !== undefined && texto !== null) elemento.textContent = texto;
  return elemento;
}

function criarBotao(texto, opcoes) {
  opcoes = opcoes || {};
  const botao = el('button', 'botao ' + (opcoes.classe || 'botao-secundario'));
  botao.type = 'button';

  if (opcoes.icone) {
    const span = el('span');
    span.innerHTML = icone(opcoes.icone);
    botao.appendChild(span.firstChild);
  }

  if (texto) botao.appendChild(document.createTextNode(texto));
  if (opcoes.titulo) botao.title = opcoes.titulo;
  if (opcoes.aoClicar) botao.addEventListener('click', opcoes.aoClicar);

  return botao;
}

function criarEtiqueta(texto, cor) {
  return el('span', 'etiqueta etiqueta-' + cor, texto);
}

// Texto principal e uma ou mais linhas de detalhe menores
function textoDuplo(principal) {
  const caixa = el('div');
  caixa.appendChild(el('div', 'principal', principal));

  Array.prototype.slice.call(arguments, 1).forEach(function(detalhe) {
    if (detalhe) caixa.appendChild(el('div', 'secundario', detalhe));
  });

  return caixa;
}

// ----------------------------------------------------------------
// FORMATAÇÃO
// ----------------------------------------------------------------
function formatarMoeda(valor) {
  return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarData(texto) {
  if (!texto) return '';
  const partes = String(texto).split('-');
  if (partes.length !== 3) return texto;
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}

function dataParaTexto(data) {
  return data.getFullYear() + '-' +
    String(data.getMonth() + 1).padStart(2, '0') + '-' +
    String(data.getDate()).padStart(2, '0');
}

function hojeTexto() {
  return dataParaTexto(new Date());
}

function hojePorExtenso() {
  const texto = new Date().toLocaleDateString('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function saudacaoDoHorario() {
  const hora = new Date().getHours();
  if (hora < 12) return 'Bom dia';
  if (hora < 18) return 'Boa tarde';
  return 'Boa noite';
}

function primeiroNome(nome) {
  return String(nome || '').trim().split(/\s+/)[0] || '';
}

function iniciais(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '?';
  const primeira = partes[0].charAt(0);
  const ultima = partes.length > 1 ? partes[partes.length - 1].charAt(0) : '';
  return (primeira + ultima).toUpperCase();
}

function normalizarBusca(texto) {
  return String(texto || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

// ----------------------------------------------------------------
// COMUNICAÇÃO COM O SERVIDOR
// ----------------------------------------------------------------
function api(funcao) {
  const argumentos = Array.prototype.slice.call(arguments, 1);

  return new Promise(function(resolver, rejeitar) {
    const executor = google.script.run
      .withSuccessHandler(resolver)
      .withFailureHandler(function(erro) {
        // O Google às vezes coloca "Error: " na frente da mensagem
        const mensagem = String((erro && erro.message) ? erro.message : erro)
          .replace(/^(Exception|Error|Erro|TypeError):\s*/i, '');

        const falha = new Error(mensagem);

        if (estado.token && /Sessão (expirada|não encontrada)/.test(mensagem)) {
          // Com "Manter conectado", a sessão é renovada sem pedir a senha
          // No modo teste não renova sozinho (voltaria ao sistema real no meio de uma ação)
          if (estado.usuario && !estado.usuario.modo_teste && loginSalvoDe(estado.usuario.usuario_id)) {
            falha.sessaoExpirada = true;
          } else {
            sessaoExpirada();
          }
        }

        rejeitar(falha);
      });

    // Página aberta antes de uma atualização do sistema: a função nova
    // ainda não existe para ela. Basta recarregar.
    if (typeof executor[funcao] !== 'function') {
      rejeitar(new Error('O sistema foi atualizado. Recarregue a página (tecla F5) para continuar.'));
      return;
    }

    executor[funcao].apply(null, argumentos);
  });
}

// Mesma coisa, enviando o token da sessão como primeiro argumento.
// Se a sessão de 6 horas acabou e há login salvo, renova e repete a chamada.
function apiSessao(funcao) {
  const argumentos = Array.prototype.slice.call(arguments, 1);

  return api.apply(null, [funcao, estado.token].concat(argumentos))
    .catch(function(erro) {
      if (!erro.sessaoExpirada) throw erro;

      return renovarSessao().then(function() {
        return api.apply(null, [funcao, estado.token].concat(argumentos));
      });
    });
}

// Várias chamadas podem descobrir ao mesmo tempo que a sessão acabou:
// todas esperam a mesma renovação.
let renovacaoEmAndamento = null;

function renovarSessao() {
  if (renovacaoEmAndamento) return renovacaoEmAndamento;

  // Renova sempre com o login salvo DA CONTA DESTA ABA
  const usuarioId = estado.usuario.usuario_id;

  renovacaoEmAndamento = api('entrarComLoginSalvo', loginSalvoDe(usuarioId), true, usuarioId)
    .then(function(resposta) {
      estado.token = resposta.token;
      guardar('sessao_token', resposta.token);
    })
    .catch(function(erro) {
      apagarLoginSalvo(usuarioId);
      sessaoExpirada();
      throw erro;
    })
    .finally(function() { renovacaoEmAndamento = null; });

  return renovacaoEmAndamento;
}

// Deixa o botão "carregando" enquanto a promessa não termina
function comCarregamento(botao, promessa) {
  const conteudoOriginal = botao.innerHTML;
  const larguraOriginal = botao.offsetWidth;

  botao.disabled = true;
  botao.style.minWidth = larguraOriginal + 'px';
  botao.innerHTML = '<span class="spinner-pequeno"></span>';

  return promessa.finally(function() {
    botao.disabled = false;
    botao.innerHTML = conteudoOriginal;
    botao.style.minWidth = '';
  });
}

// ----------------------------------------------------------------
// AVISOS (TOAST)
// ----------------------------------------------------------------
function avisar(mensagem, tipo) {
  tipo = tipo || 'sucesso';

  const toast = el('div', 'toast ' + tipo);
  const marcador = el('span');
  marcador.innerHTML = icone(tipo === 'erro' ? 'erro' : 'check');
  toast.appendChild(marcador.firstChild);
  toast.appendChild(el('div', 'texto', mensagem));

  $('toasts').appendChild(toast);

  setTimeout(function() {
    toast.classList.add('saindo');
    setTimeout(function() { toast.remove(); }, 250);
  }, tipo === 'erro' ? 6000 : 3500);
}

// ----------------------------------------------------------------
// JANELAS (MODAL)
// ----------------------------------------------------------------
function abrirModal(titulo, conteudo, opcoes) {
  opcoes = opcoes || {};

  $('modalTitulo').textContent = titulo;
  $('modalCorpo').innerHTML = '';
  $('modalCorpo').appendChild(conteudo);
  $('modal').classList.toggle('pequeno', !!opcoes.pequeno);
  $('modal').classList.toggle('largo', !!opcoes.largo);
  $('modalFundo').hidden = false;
  document.body.style.overflow = 'hidden';

  preencherIcones($('modalCorpo'));

  // Foca o primeiro campo (no computador)
  if (window.innerWidth > 900) {
    const primeiro = conteudo.querySelector('input:not([type=hidden]):not([readonly]), select');
    if (primeiro) {
      setTimeout(function() {
        // Só foca se a pessoa ainda não clicou em outro campo
        if (!$('modalCorpo').contains(document.activeElement)) primeiro.focus();
      }, 50);
    }
  }
}

function fecharModal() {
  $('modalFundo').hidden = true;
  $('modalCorpo').innerHTML = '';
  document.body.style.overflow = '';
}

$('modalFechar').addEventListener('click', fecharModal);

// Confirmação com a aparência do sistema (substitui o confirm do navegador)
function confirmar(opcoes) {
  return new Promise(function(resolver) {
    $('confirmacaoTitulo').textContent = opcoes.titulo || 'Confirmar';
    $('confirmacaoTexto').textContent = opcoes.mensagem || '';

    const ok = $('confirmacaoOk');
    const cancelar = $('confirmacaoCancelar');

    ok.textContent = opcoes.textoBotao || 'Confirmar';
    ok.className = 'botao ' + (opcoes.perigo ? 'botao-perigo' : 'botao-primario');
    cancelar.textContent = opcoes.textoCancelar || 'Cancelar';

    $('confirmacaoFundo').hidden = false;
    ok.focus();

    function terminar(resposta) {
      $('confirmacaoFundo').hidden = true;
      ok.removeEventListener('click', aoConfirmar);
      cancelar.removeEventListener('click', aoCancelar);
      document.removeEventListener('keydown', aoTeclar);
      resolver(resposta);
    }

    function aoConfirmar() { terminar(true); }
    function aoCancelar() { terminar(false); }
    function aoTeclar(evento) { if (evento.key === 'Escape') terminar(false); }

    ok.addEventListener('click', aoConfirmar);
    cancelar.addEventListener('click', aoCancelar);
    document.addEventListener('keydown', aoTeclar);
  });
}

// ----------------------------------------------------------------
// FORMULÁRIOS EM JANELA
// ----------------------------------------------------------------
function clonarModelo(id) {
  return document.getElementById(id).content.firstElementChild.cloneNode(true);
}

// Lê os campos do formulário pelo atributo name
function lerFormulario(form) {
  const dados = {};

  Array.prototype.forEach.call(form.elements, function(campo) {
    if (!campo.name) return;
    dados[campo.name] = campo.type === 'checkbox' ? campo.checked : campo.value;
  });

  return dados;
}

function preencherFormulario(form, dados) {
  Object.keys(dados || {}).forEach(function(nome) {
    const campo = form.elements[nome];
    if (!campo) return;

    if (campo.type === 'checkbox') {
      campo.checked = !!dados[nome];
    } else {
      campo.value = dados[nome] === null || dados[nome] === undefined ? '' : dados[nome];
    }
  });
}

function mostrarErroFormulario(form, mensagem) {
  const caixa = form.querySelector('[data-erro]');

  if (!caixa) {
    avisar(mensagem, 'erro');
    return;
  }

  caixa.textContent = mensagem;
  caixa.hidden = !mensagem;

  if (mensagem) caixa.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Abre um formulário numa janela e cuida do envio.
// aoEnviar(dados, form) deve devolver uma promessa; se ela der certo, a janela fecha.
function abrirFormulario(opcoes) {
  const form = clonarModelo(opcoes.modelo);

  if (opcoes.aoAbrir) opcoes.aoAbrir(form);

  const botaoEnviar = form.querySelector('[data-enviar]');
  if (opcoes.textoBotao && botaoEnviar) botaoEnviar.textContent = opcoes.textoBotao;

  form.querySelectorAll('[data-cancelar]').forEach(function(botao) {
    botao.addEventListener('click', fecharModal);
  });

  form.addEventListener('submit', function(evento) {
    evento.preventDefault();
    mostrarErroFormulario(form, '');

    let promessa;

    try {
      promessa = Promise.resolve(opcoes.aoEnviar(lerFormulario(form), form));
    } catch (erro) {
      promessa = Promise.reject(erro);
    }

    comCarregamento(botaoEnviar, promessa)
      .then(function(resultado) {
        if (resultado === false) return;
        fecharModal();
        if (opcoes.depois) opcoes.depois(resultado);
      })
      .catch(function(erro) {
        mostrarErroFormulario(form, erro.message);
      });
  });

  abrirModal(opcoes.titulo, form, { pequeno: opcoes.pequeno, largo: opcoes.largo });
  return form;
}

// ----------------------------------------------------------------
// MÁSCARAS DE DIGITAÇÃO (data-mascara="telefone|cnpj|moeda")
// ----------------------------------------------------------------
const MASCARAS = {
  telefone: function(valor) {
    const n = valor.replace(/\D/g, '').slice(0, 11);
    if (n.length <= 2) return n.length ? '(' + n : '';
    if (n.length <= 6) return '(' + n.slice(0, 2) + ') ' + n.slice(2);
    if (n.length <= 10) return '(' + n.slice(0, 2) + ') ' + n.slice(2, 6) + '-' + n.slice(6);
    return '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7);
  },

  cnpj: function(valor) {
    const n = valor.replace(/\D/g, '').slice(0, 14);
    let texto = n.slice(0, 2);
    if (n.length > 2) texto += '.' + n.slice(2, 5);
    if (n.length > 5) texto += '.' + n.slice(5, 8);
    if (n.length > 8) texto += '/' + n.slice(8, 12);
    if (n.length > 12) texto += '-' + n.slice(12);
    return texto;
  },

  // Digitação tipo caixa registradora: 1850 vira 18,50
  moeda: function(valor) {
    const n = valor.replace(/\D/g, '').replace(/^0+/, '').slice(0, 8);
    if (!n) return '';
    return (Number(n) / 100).toLocaleString('pt-BR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }
};

document.addEventListener('input', function(evento) {
  const campo = evento.target;
  const mascara = campo.dataset && MASCARAS[campo.dataset.mascara];
  if (mascara) campo.value = mascara(campo.value);
});

function aplicarMascara(valor, tipo) {
  return MASCARAS[tipo] ? MASCARAS[tipo](String(valor || '')) : valor;
}

// Botão de mostrar/ocultar senha
document.addEventListener('click', function(evento) {
  const botao = evento.target.closest('[data-mostrar-senha]');
  if (!botao) return;

  const campo = $(botao.dataset.mostrarSenha);
  campo.type = campo.type === 'password' ? 'text' : 'password';
  botao.title = campo.type === 'password' ? 'Mostrar senha' : 'Ocultar senha';
});

// ----------------------------------------------------------------
// LISTAS (tabela no computador, cartões no celular)
// ----------------------------------------------------------------
// colunas: [{ titulo, largura, valor(item) }]  — a primeira coluna é o título do cartão
// acoes(item): devolve uma lista de botões; larguraAcoes: largura fixa dessa coluna
function renderizarLista(container, opcoes) {
  container.innerHTML = '';

  if (!opcoes.itens.length) {
    container.appendChild(estadoVazio(opcoes.vazio || {}));
    return;
  }

  const colunas = opcoes.colunas;
  const larguras = colunas.map(function(c) { return c.largura || 'minmax(0, 1fr)'; });
  if (opcoes.acoes) larguras.push(opcoes.larguraAcoes || '180px');

  const lista = el('div', 'lista');
  lista.style.setProperty('--colunas', larguras.join(' '));

  const cabecalho = el('div', 'lista-cabecalho');
  colunas.forEach(function(coluna) { cabecalho.appendChild(el('div', '', coluna.titulo)); });
  if (opcoes.acoes) cabecalho.appendChild(el('div', '', ''));
  lista.appendChild(cabecalho);

  opcoes.itens.forEach(function(item) {
    const linha = el('div', 'lista-linha');
    if (opcoes.apagada && opcoes.apagada(item)) linha.classList.add('apagada');

    colunas.forEach(function(coluna, indice) {
      const celula = el('div', 'lista-celula' + (indice === 0 ? ' celula-titulo' : ''));
      celula.dataset.rotulo = coluna.titulo;

      const valor = coluna.valor(item);

      if (valor instanceof Node) {
        celula.appendChild(valor);

function filtrarFuncionarios(lista, busca, status) {
  const termo = normalizarBusca(busca);

  return lista.filter(function(f) {
    if (status && status !== 'TODOS' && f.status !== status) return false;
    if (!termo) return true;
    return normalizarBusca(f.nome + ' ' + f.matricula + ' ' + f.setor).indexOf(termo) !== -1;
  });
}

// Dados com menos de 30 segundos não precisam ser buscados de novo
const VALIDADE_DADOS_MS = 30000;

function recente(momento) {
  return !!momento && (Date.now() - momento) < VALIDADE_DADOS_MS;
}

function ordenarPorNome(lista, campo) {
  return lista.sort(function(a, b) {
    return String(a[campo] || '').localeCompare(String(b[campo] || ''), 'pt-BR');
  });
}

// Troca (ou acrescenta) um item numa lista em memória, pelo campo-chave
function substituirItem(lista, chave, item) {
  if (!item) return lista;

  const indice = lista.findIndex(function(atual) { return atual[chave] === item[chave]; });

  if (indice === -1) {
    lista.push(item);
  } else {
    lista[indice] = item;
  }

  return lista;
}

function removerItem(lista, chave, valor) {
  const indice = lista.findIndex(function(atual) { return atual[chave] === valor; });
  if (indice !== -1) lista.splice(indice, 1);
  return lista;
}

// ----------------------------------------------------------------
function copiarTexto(texto) {
  function metodoAntigo() {
    const area = el('textarea');
    area.value = texto;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    return ok;
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(texto)
      .then(function() { return true; })
      .catch(function() { return metodoAntigo(); });
  }

  return Promise.resolve(metodoAntigo());
}

// Gera uma senha forte e fácil de ler (ex.: Kp7m-Qx3t-Wb9n)
function gerarSenha() {
  const alfabeto = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  const numeros = new Uint32Array(12);
  window.crypto.getRandomValues(numeros);

  let senha = '';
  for (let i = 0; i < 12; i++) {
    senha += alfabeto[numeros[i] % alfabeto.length];
    if (i === 3 || i === 7) senha += '-';
  }
  return senha;
}

// Itens marcados "somenteProprietario" só aparecem para o dono do restaurante.
// Itens com "recurso" somem quando a função está desligada (Sistema › Configurações).
function recursoLigado(nome) {
  const recursos = estado.usuario && estado.usuario.recursos;
  return !recursos || recursos[nome] !== false;
}

// Abas e funções liberadas pelo proprietário (Sistema › Acessos)
function telaLiberada(chave) {
  if (!estado.usuario || estado.usuario.perfil !== 'admin') return true;
  const telas = estado.usuario.recursos && estado.usuario.recursos.telas;
  return !telas || telas[chave] === true;
}

function podeFazer(funcao) {
  if (!estado.usuario || estado.usuario.perfil !== 'admin') return false;
  const funcoes = estado.usuario.recursos && estado.usuario.recursos.funcoes;
  return !funcoes || funcoes[funcao] === true;
}

function itensDoMenu() {
  const itens = (MENUS[estado.usuario.perfil] || []).filter(function(item) {
    if (item.somenteProprietario && !estado.usuario.proprietario) return false;
    if (item.recurso && !recursoLigado(item.recurso)) return false;
    if (item.permissao && !telaLiberada(item.permissao)) return false;
    return true;
  });

  // Tira os títulos de grupo que ficaram sem nenhuma tela
  return itens.filter(function(item, i) {
    if (!item.grupo) return true;
    const proximo = itens[i + 1];
    return !!proximo && !proximo.grupo;
  });
}

// O proprietário mudou as configurações: refaz os menus sem recarregar
function aplicarRecursos(recursos) {
  if (!recursos || !estado.usuario) return;
  if (JSON.stringify(recursos) === JSON.stringify(estado.usuario.recursos || null)) return;

  const funcoesAntes = JSON.stringify((estado.usuario.recursos && estado.usuario.recursos.funcoes) || null);
  estado.usuario.recursos = recursos;
  montarMenus();
  const funcoesMudaram = funcoesAntes !== JSON.stringify(recursos.funcoes || null);

  const atual = itensDoMenu().find(function(i) { return i.id === estado.telaAtual; });

  if (!atual) {
    fecharModal();
    irPara(itensDoMenu()[0].id);
    avisar('Esta tela foi desligada pelo restaurante.');
    return;
  }

  document.querySelectorAll('[data-tela]').forEach(function(botao) {
    botao.classList.toggle('ativo', botao.dataset.tela === estado.telaAtual);
  });

  AO_MUDAR_RECURSOS.forEach(function(avisarTela) {
    try { avisarTela(recursos); } catch (erro) { console.error(erro); }
  });

  // Funções liberadas/bloqueadas: redesenha a tela atual com os botões certos
  if (funcoesMudaram && TELAS[estado.telaAtual] && TELAS[estado.telaAtual].carregar) {
    try { TELAS[estado.telaAtual].carregar(); } catch (erro) { console.error(erro); }
  }
}

// Telas que precisam se refazer quando as configurações mudam
const AO_MUDAR_RECURSOS = [];

function montarMenus() {
  const menu = $('menuLateral');
  const barra = $('barraInferior');
  menu.innerHTML = '';
  barra.innerHTML = '';

  itensDoMenu().forEach(function(item) {
    if (item.grupo) {
      menu.appendChild(el('div', 'menu-grupo', item.grupo));
      return;
    }

    const botao = el('button', 'menu-item');
    botao.type = 'button';
    botao.dataset.tela = item.id;
    botao.innerHTML = icone(item.icone);
    botao.appendChild(el('span', '', item.titulo));
    if (item.emBreve) botao.appendChild(el('span', 'selo-breve', 'em breve'));
    botao.addEventListener('click', function() { irPara(item.id); });
    menu.appendChild(botao);
  });

  const idsBarra = BARRA_INFERIOR[estado.usuario.perfil] || [];

  idsBarra.forEach(function(id) {
    const item = itensDoMenu().find(function(i) { return i.id === id; });
    if (!item) return;
    barra.appendChild(criarItemBarra(item.titulo, item.icone, function() { irPara(id); }, id));
  });

  // "Mais" abre o menu completo quando há mais telas do que cabem na barra
  const totalTelas = itensDoMenu().filter(function(i) { return i.id; }).length;

  if (totalTelas > idsBarra.length) {
    barra.appendChild(criarItemBarra('Mais', 'mais', abrirMenuCelular));
  }
}

function criarItemBarra(titulo, nomeIcone, aoClicar, id) {
  const botao = el('button', 'item-barra');

function irPara(id, parametros) {
  const item = itensDoMenu().find(function(i) { return i.id === id; });
  if (!item) return;

  // Avisa a tela atual que ela vai ser fechada (ex.: salvar o que falta)
  const telaAnterior = TELAS[estado.telaAtual];
  if (telaAnterior && telaAnterior.aoSair && estado.telaAtual !== id) telaAnterior.aoSair();

  estado.telaAtual = id;
  guardar('tela_atual', id);

  fecharMenuCelular();
  $('menuConta').hidden = true;

  // Marca o item ativo nos dois menus
  document.querySelectorAll('[data-tela]').forEach(function(botao) {
    botao.classList.toggle('ativo', botao.dataset.tela === id);
  });

  $('tituloPagina').textContent = item.titulo;
  definirTitulo(item.titulo);

  const idView = item.emBreve ? 'em-breve' : id;

  document.querySelectorAll('.view').forEach(function(view) {
    view.hidden = view.dataset.view !== idView;
  });

  if (item.emBreve) {
    $('emBreveIcone').innerHTML = icone(item.icone);
    $('emBreveTitulo').textContent = item.titulo + ' — em construção';
    $('emBreveTexto').textContent = item.texto || 'Este módulo será liberado nas próximas etapas.';
  } else if (TELAS[id] && TELAS[id].carregar) {
    TELAS[id].carregar(parametros || {});
  }

  window.scrollTo(0, 0);
}

// ----------------------------------------------------------------
// SESSÃO (mantém o login ao atualizar a página)
// ----------------------------------------------------------------
function guardar(chave, valor) {
  try { sessionStorage.setItem(chave, valor); } catch (erro) { /* navegador bloqueou */ }
}

function ler(chave) {
  try { return sessionStorage.getItem(chave); } catch (erro) { return null; }
}

function apagar(chave) {
  try { sessionStorage.removeItem(chave); } catch (erro) { /* nada */ }
}

// Guardado no aparelho mesmo depois de fechar o navegador ("Manter conectado")
function guardarPermanente(chave, valor) {
  try { localStorage.setItem(chave, valor); } catch (erro) { /* navegador bloqueou */ }
}

function lerPermanente(chave) {
  try { return localStorage.getItem(chave); } catch (erro) { return null; }
}

function apagarPermanente(chave) {
  try { localStorage.removeItem(chave); } catch (erro) { /* nada */ }
}

// ----------------------------------------------------------------
// LOGINS SALVOS ("Manter conectado")
// Um por conta: o aparelho pode ter o restaurante e uma empresa
// conectados em abas diferentes sem que uma interfira na outra.
// ----------------------------------------------------------------
function lerLoginsSalvos() {
  try { return JSON.parse(lerPermanente('logins_salvos') || '{}') || {}; } catch (erro) { return {}; }
}

function loginSalvoDe(usuarioId) {
  return usuarioId ? lerLoginsSalvos()[usuarioId] || null : null;
}

function guardarLoginSalvo(usuarioId, lembrete) {
  const logins = lerLoginsSalvos();
  logins[usuarioId] = lembrete;
  guardarPermanente('logins_salvos', JSON.stringify(logins));
  guardarPermanente('ultimo_login_salvo', usuarioId);
  apagarPermanente('login_salvo');   // formato antigo (um só para o aparelho)
}

function apagarLoginSalvo(usuarioId) {
  const logins = lerLoginsSalvos();
  delete logins[usuarioId];
  guardarPermanente('logins_salvos', JSON.stringify(logins));
  if (lerPermanente('ultimo_login_salvo') === usuarioId) apagarPermanente('ultimo_login_salvo');
}

// Login usado ao abrir o sistema numa aba nova: o da última conta que entrou
function loginSalvoAoAbrir() {
  return loginSalvoDe(lerPermanente('ultimo_login_salvo')) || lerPermanente('login_salvo');
}

function mostrarLogin() {
  $('telaCarregando').hidden = true;
  $('app').hidden = true;
  $('telaConvite').hidden = true;
  $('telaLogin').hidden = false;
  document.title = 'Entrar · Tempero de Mãe';
  $('loginEmail').focus();
}

function entrar(token, usuario, dadosIniciais) {
  estado.token = token;
  estado.usuario = usuario;
  guardar('sessao_token', token);

  const nomeExibido = usuario.perfil === 'admin' ? usuario.nome : (usuario.nome_empresa || usuario.nome);
  const perfilExibido = usuario.perfil === 'admin' ? 'Restaurante' : 'Responsável: ' + primeiroNome(usuario.nome);

  $('sidebarAvatar').textContent = iniciais(nomeExibido);
  $('sidebarNome').textContent = nomeExibido;
  $('sidebarPerfil').textContent = perfilExibido;
  $('botaoConta').textContent = iniciais(usuario.nome);
  $('contaNome').textContent = usuario.nome;
  $('contaEmail').textContent = usuario.perfil === 'empresa' && usuario.login ? 'Usuário: ' + usuario.login : usuario.email;

  mostrarModoTeste(usuario);
  montarMenus();

  AO_ENTRAR.forEach(function(receber) {
    try { receber(dadosIniciais || {}, usuario); } catch (erro) { console.error(erro); }
  });

  $('telaCarregando').hidden = true;
  $('telaLogin').hidden = true;
  $('telaConvite').hidden = true;
  $('app').hidden = false;

  const ultimaTela = ler('tela_atual');
  const telaValida = itensDoMenu().some(function(i) { return i.id === ultimaTela; });

  irPara(telaValida ? ultimaTela : itensDoMenu()[0].id);
}

function sessaoExpirada() {
  if (!estado.token) return;
  estado.token = null;
  apagar('sessao_token');
  fecharModal();
  avisar('Sua sessão expirou. Entre novamente.', 'erro');
  mostrarLogin();
}

// SAIR
// Não recarrega a página: dentro do Google Apps Script, recarregar por
// código deixa a tela em branco. Em vez disso, termina o que estiver
// salvando, apaga da memória os dados de quem saiu e mostra o login.
function sair() {
  if (!estado.token) return;

  const pedidoNaoEnviado = typeof pedidoEmpresa !== 'undefined' && pedidoEmpresa.alterado;

  const continuar = pedidoNaoEnviado
    ? confirmar({
        titulo: 'Sair sem enviar as alterações?',
        mensagem: 'As mudanças no pedido de hoje ainda não foram enviadas ao restaurante.',
        textoBotao: 'Sair mesmo assim',
        textoCancelar: 'Voltar',
        perigo: true
      })
    : Promise.resolve(true);

  continuar
    .then(function(sim) {
      if (!sim) return false;
      return terminarSalvamentos();
    })
    .then(function(podeSair) {
      if (podeSair) encerrarNoAparelho();
    });
}

// Cardápio: o restaurante pode ter alterações sendo salvas sozinhas
function terminarSalvamentos() {
  if (!estado.usuario || estado.usuario.perfil !== 'admin' || typeof aguardarSalvamento !== 'function') {
    return Promise.resolve(true);
  }

  return aguardarSalvamento()
    .catch(function() { /* o erro já foi mostrado na tela */ })
    .then(function() {
      if (!cardapioAdmin.alterado) return true;

      return confirmar({
        titulo: 'Sair sem salvar o cardápio?',
        mensagem: 'Algumas alterações do cardápio não foram salvas.',
        textoBotao: 'Sair mesmo assim',
        textoCancelar: 'Voltar',
        perigo: true
      });
    });
}

function encerrarNoAparelho() {
  const token = estado.token;
  const usuarioId = estado.usuario ? estado.usuario.usuario_id : '';
  const loginSalvo = loginSalvoDe(usuarioId);

  // Avisa o servidor sem esperar a resposta: a tela de login aparece na hora
  api('encerrarSessao', token, loginSalvo).catch(function() { /* nada */ });

  if (usuarioId) apagarLoginSalvo(usuarioId);
  apagar('tela_atual');
  limparDadosDaTela();
  mostrarLogin();
}

// Apaga da memória e da tela os dados de quem estava usando
// (ao sair da conta e ao entrar ou sair do modo teste)
function limparDadosDaTela() {
  estado.token = null;
  estado.usuario = null;
  estado.telaAtual = null;
  estado.tituloPagina = null;
  estado.pendenciasTitulo = 0;
  apagar('sessao_token');

  AO_SAIR.forEach(function(limpar) {
    try { limpar(); } catch (erro) { console.error(erro); }
  });

  fecharModal();
  fecharMenuCelular();
  $('menuConta').hidden = true;
  $('toasts').innerHTML = '';
  $('areaImpressao').innerHTML = '';
  document.querySelectorAll('.view').forEach(function(view) { view.hidden = true; });

  // Esvazia o que as telas preencheram com os dados de quem saiu
  // (volta ao estado de quando a página abriu)
  BLOCOS_COM_DADOS.forEach(function(id) {
    const bloco = document.getElementById(id);
    if (bloco) bloco.textContent = '';
  });

  $('loginSenha').value = '';
  $('erroLogin').hidden = true;
}

// ----------------------------------------------------------------
// MODO TESTE (somente o proprietário)
// Troca a sessão por outra que usa uma planilha separada, com dados
// fictícios. Ao sair, tudo o que foi feito no teste é apagado.
// ----------------------------------------------------------------
function mostrarModoTeste(usuario) {
  const emTeste = !!usuario.modo_teste;
  document.body.classList.toggle('em-modo-teste', emTeste);
  $('faixaTeste').hidden = !emTeste;

  document.querySelectorAll('[data-acao="modo-teste"]').forEach(function(botao) {
    botao.hidden = !(usuario.perfil === 'admin' && usuario.proprietario && !emTeste);
  });
}

function trocarModo(resposta, mensagem) {
  limparDadosDaTela();
  entrar(resposta.token, resposta.usuario, resposta.dados_iniciais);
  avisar(mensagem);
}

function mostrarCarregandoTela(texto) {
  $('textoCarregando').textContent = texto || '';
  $('telaCarregando').hidden = false;
}

function esconderCarregandoTela() {
  $('telaCarregando').hidden = true;
  $('textoCarregando').textContent = '';
}

function entrarModoTeste() {
  $('menuConta').hidden = true;
  fecharMenuCelular();

  terminarSalvamentos()
    .then(function(pode) {
      if (!pode) return false;
      return confirmar({
        titulo: 'Entrar no modo teste?',
        mensagem: 'Você vai usar uma cópia separada do sistema, com empresas, pedidos e cobranças fictícios. ' +
          'Pode cadastrar, alterar e apagar à vontade: nada vai para o sistema real, e tudo é apagado quando você sair do teste.',
        textoBotao: 'Entrar no modo teste',
        textoCancelar: 'Cancelar'
      });
    })
    .then(function(sim) {
      if (!sim) return;
      mostrarCarregandoTela('Preparando o modo teste com dados fictícios…');

      return apiSessao('entrarModoTeste')
        .then(function(resposta) {
          esconderCarregandoTela();
          trocarModo(resposta, 'Você está no modo teste. Nada do que fizer aqui fica salvo.');
        })
        .catch(function(erro) {
          esconderCarregandoTela();
          avisar(erro.message, 'erro');
        });
    });
}

function sairModoTeste() {
  confirmar({
    titulo: 'Sair do modo teste?',
    mensagem: 'Tudo o que você fez no teste será apagado, e você volta ao sistema real.',
    textoBotao: 'Sair do teste',
    textoCancelar: 'Continuar testando'
  }).then(function(sim) {
    if (!sim) return;
    mostrarCarregandoTela('Apagando o teste e voltando ao sistema real…');

    return api('sairModoTeste', estado.token)
      .then(function(resposta) {
        esconderCarregandoTela();
        trocarModo(resposta, 'Você voltou ao sistema real. O teste foi apagado.');
      })
      .catch(function(erro) {
        esconderCarregandoTela();
        avisar(erro.message, 'erro');
      });
  });
}

// LOGIN
$('formLogin').addEventListener('submit', function(evento) {
  evento.preventDefault();

  const botao = this.querySelector('button[type=submit]');
  const erro = $('erroLogin');
  erro.hidden = true;

  const email = $('loginEmail').value.trim();
  const senha = $('loginSenha').value;

  if (!email || !senha) {
    erro.textContent = 'Informe o usuário e a senha.';
    erro.hidden = false;
    return;
  }

  const lembrar = $('loginLembrar').checked;
  guardarPermanente('lembrar_login', lembrar ? 'sim' : 'nao');

  comCarregamento(botao, api('autenticarUsuario', email, senha, lembrar))
    .then(function(resposta) {
      $('loginSenha').value = '';

      if (resposta.lembrete) {
        guardarLoginSalvo(resposta.usuario.usuario_id, resposta.lembrete);
      } else {
        apagarLoginSalvo(resposta.usuario.usuario_id);
      }

      entrar(resposta.token, resposta.usuario, resposta.dados_iniciais);
    })
    .catch(function(falha) {
      erro.textContent = falha.message;
      erro.hidden = false;
    });
});

function abrirTrocarSenha() {
  $('menuConta').hidden = true;
  fecharMenuCelular();

  abrirFormulario({
    titulo: 'Trocar minha senha',
    modelo: 'tplTrocarSenha',
    pequeno: true,
    aoEnviar: function(dados) {

  });
}

// INÍCIO: um link de convite abre a tela de primeiro acesso. Senão,
// tenta retomar a sessão desta aba e, se não houver, usa o login salvo
// no aparelho ("Manter conectado").
// ----------------------------------------------------------------
// TEMA (claro / escuro / automático)
// A escolha fica guardada neste aparelho. "Automático" segue o
// modo escuro do celular ou computador e muda junto com ele.
// ----------------------------------------------------------------
const OPCOES_TEMA = [
  { valor: 'claro', texto: 'Claro', icone: 'sol' },
  { valor: 'escuro', texto: 'Escuro', icone: 'lua' },
  { valor: 'auto', texto: 'Auto', icone: 'automatico', dica: 'Segue o aparelho' }
];

function preferenciaTema() {
  const tema = lerPermanente('tema');
  return tema === 'claro' || tema === 'escuro' ? tema : 'auto';
}

function aparelhoNoEscuro() {
  try {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (erro) { return false; }
}

function aplicarTema() {
  const preferencia = preferenciaTema();
  const escuro = preferencia === 'escuro' || (preferencia === 'auto' && aparelhoNoEscuro());
  document.documentElement.setAttribute('data-tema', escuro ? 'escuro' : 'claro');

  document.querySelectorAll('.seletor-tema button').forEach(function(botao) {
    const ativo = botao.dataset.tema === preferencia;
    botao.classList.toggle('ativo', ativo);
    botao.setAttribute('aria-pressed', ativo ? 'true' : 'false');
  });
}

function escolherTema(tema) {
  guardarPermanente('tema', tema);
  aplicarTema();
}

function montarSeletoresTema() {
  document.querySelectorAll('[data-seletor-tema]').forEach(function(bloco) {
    if (bloco.dataset.montado) return;
    bloco.dataset.montado = 'sim';

    const rotulo = document.createElement('span');
    rotulo.className = 'rotulo-tema';
    rotulo.textContent = 'Aparência';

    const grupo = document.createElement('div');
    grupo.className = 'seletor-tema';
    grupo.setAttribute('role', 'group');
    grupo.setAttribute('aria-label', 'Aparência');

    OPCOES_TEMA.forEach(function(opcao) {
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.dataset.tema = opcao.valor;
      botao.title = opcao.dica || opcao.texto;
      botao.innerHTML = icone(opcao.icone);
      const texto = document.createElement('span');
      texto.className = 'texto-tema';
      texto.textContent = opcao.texto;
      botao.appendChild(texto);
      botao.setAttribute('aria-label', opcao.texto);
      botao.addEventListener('click', function(evento) {
        evento.stopPropagation();
        escolherTema(opcao.valor);
      });
      grupo.appendChild(botao);
    });

    bloco.appendChild(rotulo);
    bloco.appendChild(grupo);
  });
  aplicarTema();
}

// Se o aparelho mudar de claro para escuro (ex.: à noite), acompanha no modo automático
(function vigiarTemaDoAparelho() {
  try {
    const consulta = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (!consulta) return;
    const aoMudar = function() { if (preferenciaTema() === 'auto') aplicarTema(); };
    if (consulta.addEventListener) consulta.addEventListener('change', aoMudar);
    else if (consulta.addListener) consulta.addListener(aoMudar);
  } catch (erro) { /* navegador antigo: fica no tema atual */ }
})();

function montarFundosAnimados() {
  document.querySelectorAll('[data-fundo-animado]').forEach(function(fundo) {
    if (fundo.dataset.montado) return;
    fundo.dataset.montado = 'sim';

    ['mancha mancha-1', 'mancha mancha-2', 'mancha mancha-3'].forEach(function(classe) {
      fundo.appendChild(el('span', classe));
    });

    ITENS_FUNDO.forEach(function(item, i) {
      const icone = el('span', 'icone-flutuante');
      icone.style.left = item[1] + '%';
      icone.style.setProperty('--tamanho', item[2] + 'px');
      icone.style.setProperty('--duracao', item[3] + 's');

      fundo.appendChild(icone);

  // Vapor saindo do ícone da marca nas telas de entrada

}

function iniciar() {
  preencherIcones();
  montarSeletoresTema();
  montarFundosAnimados();
  $('loginLembrar').checked = lerPermanente('lembrar_login') !== 'nao';

  lerParametrosEndereco(function(parametros) {
    if (parametros.convite) {
      abrirTelaConvite(parametros.convite);
      return;
    }
    iniciarSessao();
  });
}

// Parâmetros do endereço (?convite=...). Dentro do Google, a página roda
// num quadro: quem lê o endereço de verdade é google.script.url.
function lerParametrosEndereco(receber) {
  let respondeu = false;
  function responder(parametros) {
    if (respondeu) return;
    respondeu = true;
    receber(parametros || {});
  }

  try {
    if (window.google && google.script && google.script.url) {
      google.script.url.getLocation(function(local) { responder(local && local.parameter); });
      setTimeout(function() { responder({}); }, 4000);
      return;
    }
  } catch (erro) { /* segue sem parâmetros */ }

  responder({});
}

// Tira o ?convite= do endereço, para não reabrir o convite ao atualizar a página
function limparEndereco() {
  try {
    if (window.google && google.script && google.script.history) google.script.history.replace(null, {}, '');
  } catch (erro) { /* sem problema */ }
}

// ---------- PRIMEIRO ACESSO (convite) ----------
let codigoConvite = '';

function abrirTelaConvite(codigo) {
  codigoConvite = codigo;
  $('telaCarregando').hidden = true;
  $('app').hidden = true;
  $('telaLogin').hidden = true;
  $('telaConvite').hidden = false;
  $('conviteCarregando').hidden = false;
  $('conviteInvalido').hidden = true;
  $('formConvite').hidden = true;
  document.title = 'Primeiro acesso · Tempero de Mãe';

  api('abrirConvite', codigo)
    .then(function(convite) {
      $('conviteCarregando').hidden = true;
      $('formConvite').hidden = false;
      $('conviteTitulo').textContent = convite.nova_senha ? 'Crie uma nova senha' : 'Crie sua senha';
      if (convite.administrador) {
        $('conviteTexto').textContent = convite.nova_senha
          ? 'Escolha a nova senha de acesso ao painel do restaurante.'
          : 'Bem-vindo(a), ' + primeiroNome(convite.responsavel) + '! Crie a sua senha para acessar o painel do restaurante.';
      } else {
        $('conviteTexto').textContent = convite.nova_senha
          ? 'Escolha a nova senha de acesso da ' + convite.nome_empresa + '.'
          : 'Bem-vindo(a), ' + primeiroNome(convite.responsavel || convite.nome_empresa) + '! Para começar a fazer os pedidos da ' +
            convite.nome_empresa + ', crie a sua senha.';
      }
      $('conviteUsuario').textContent = convite.usuario;
      $('conviteSenha').focus();
    })
    .catch(function(erro) {
      $('conviteCarregando').hidden = true;
      $('conviteInvalido').hidden = false;
      $('conviteInvalidoTexto').textContent = erro.message;
    });
}

$('conviteIrLogin').addEventListener('click', function() {
  limparEndereco();
  $('telaConvite').hidden = true;
  iniciarSessao();
});

$('formConvite').addEventListener('submit', function(evento) {
  evento.preventDefault();

  const botao = this.querySelector('button[type=submit]');
  const erro = $('erroConvite');
  const senha = $('conviteSenha').value;
  erro.hidden = true;

  function falhar(texto) {
    erro.textContent = texto;
    erro.hidden = false;
  }

  if (senha.length < TAMANHO_MINIMO_SENHA) return falhar('A senha precisa ter pelo menos ' + TAMANHO_MINIMO_SENHA + ' caracteres.');
  if (senha !== $('conviteConfirmacao').value) return falhar('As duas senhas não são iguais.');

  const lembrar = $('conviteLembrar').checked;
  guardarPermanente('lembrar_login', lembrar ? 'sim' : 'nao');

  comCarregamento(botao, api('concluirConvite', codigoConvite, senha, lembrar))
    .then(function(resposta) {
      $('conviteSenha').value = '';
      $('conviteConfirmacao').value = '';
      codigoConvite = '';
      limparEndereco();

      if (resposta.lembrete) guardarLoginSalvo(resposta.usuario.usuario_id, resposta.lembrete);
      $('telaConvite').hidden = true;
      entrar(resposta.token, resposta.usuario, resposta.dados_iniciais);
      avisar('Senha criada! Daqui em diante, entre com o usuário ' + resposta.usuario.login + ' e essa senha.', 'sucesso');
    })
    .catch(function(falha) { falhar(falha.message); });
});

function iniciarSessao() {
  const token = ler('sessao_token');

  if (token) {
    api('retomarSessao', token)
      .then(function(resposta) { entrar(token, resposta.usuario, resposta.dados_iniciais); })
      .catch(function() {
        apagar('sessao_token');
        entrarComLoginSalvo();
      });
    return;
  }

  entrarComLoginSalvo();
}

function entrarComLoginSalvo() {
  const loginSalvo = loginSalvoAoAbrir();

  if (!loginSalvo) {
    mostrarLogin();
    return;
  }

  api('entrarComLoginSalvo', loginSalvo)
    .then(function(resposta) {
      guardarLoginSalvo(resposta.usuario.usuario_id, loginSalvo);
      entrar(resposta.token, resposta.usuario, resposta.dados_iniciais);
    })
    .catch(function(erro) {
      const logins = lerLoginsSalvos();
      Object.keys(logins).forEach(function(id) { if (logins[id] === loginSalvo) apagarLoginSalvo(id); });
      apagarPermanente('login_salvo');
      mostrarLogin();
      if (/inativo/.test(erro.message)) {
        $('erroLogin').textContent = erro.message;
        $('erroLogin').hidden = false;
      }
    });
}

document.addEventListener('DOMContentLoaded', iniciar);
