<script>
// ================================================================
// SCRIPTPEDIDOS.html — pedido do dia
// Empresa: monta e envia o pedido de hoje (até o horário limite).
// Restaurante: acompanha, confirma/recusa, vê a lista de produção,
// registra pedidos de clientes não cadastrados e imprime para a cozinha.
// Ao vivo: os pedidos aparecem sozinhos, sem atualizar a página.
// ================================================================

const SITUACOES_PEDIDO = {
  ENVIADO: { texto: 'Aguardando confirmação', cor: 'amarela' },
  CONFIRMADO: { texto: 'Confirmado', cor: 'verde' },
  RECUSADO: { texto: 'Recusado', cor: 'vermelha' },
  CANCELADO: { texto: 'Cancelado', cor: 'cinza' }
};

function etiquetaPedido(status) {
  const situacao = SITUACOES_PEDIDO[status] || { texto: status, cor: 'cinza' };
  return criarEtiqueta(situacao.texto, situacao.cor);
}

function horaDe(ms) {
  if (!ms) return '';
  const data = new Date(ms);
  return String(data.getHours()).padStart(2, '0') + ':' + String(data.getMinutes()).padStart(2, '0');
}

function nomeDoDiaCompleto(texto) {
  const data = textoParaData(texto);
  return NOMES_DIAS_LONGOS[data.getDay()] + ', ' + formatarData(texto).slice(0, 5);
}

// Quanto tempo falta até o horário limite (usa o relógio do servidor)
function tempoRestante(prazo, recebidoEm) {
  if (!prazo || !prazo.aberto) return '';
  const partes = prazo.limite.split(':').map(Number);
  const agoraServidor = prazo.agora_ms + (Date.now() - recebidoEm);
  const limite = new Date(agoraServidor);
  limite.setHours(partes[0], partes[1], 0, 0);
  const minutos = Math.floor((limite.getTime() - agoraServidor) / 60000);
  if (minutos <= 0) return 'encerrando agora';
  if (minutos < 60) return 'faltam ' + minutos + ' min';
  return 'faltam ' + Math.floor(minutos / 60) + 'h ' + String(minutos % 60).padStart(2, '0') + 'min';
}

// Grupo de botões de escolha única (proteína, opção extra)
function criarEscolha(opcoes, valorAtual, aoEscolher, desativado) {
  const grupo = el('div', 'escolhas');

  opcoes.forEach(function(opcao) {
    const botao = el('button', 'escolha' + (opcao.valor === valorAtual ? ' marcada' : ''), opcao.texto);
    botao.type = 'button';
    botao.disabled = !!desativado;
    botao.setAttribute('aria-pressed', opcao.valor === valorAtual ? 'true' : 'false');
    botao.addEventListener('click', function() { aoEscolher(opcao.valor); });
    grupo.appendChild(botao);
  });

  return grupo;
}

// ================================================================
// EMPRESA: PEDIDO DE HOJE
// ================================================================
const pedidoEmpresa = {
  estado: null,
  recebidoEm: 0,
  selecao: {},        // { funcionario_id: { proteina, opcao_extra, itens_removidos, observacao } }
  avulsas: [],        // [{ chave, nome, proteina, opcao_extra }]
  observacoes: '',
  busca: '',
  alterado: false,
  faltando: {}        // pessoas sem proteína (destacadas depois de tentar enviar)
};

let proximaChaveAvulsa = 1;

TELAS['pedidos-empresa'] = {
  carregar: function() { carregarPedidoEmpresa(); }
};

// Ao sair: apaga o pedido em memória e para os avisos ao vivo
AO_SAIR.push(function() {
  pedidoEmpresa.estado = null;
  pedidoEmpresa.recebidoEm = 0;
  pedidoEmpresa.selecao = {};
  pedidoEmpresa.avulsas = [];
  pedidoEmpresa.observacoes = '';
  pedidoEmpresa.busca = '';
  pedidoEmpresa.alterado = false;
  pedidoEmpresa.faltando = {};
  pedidosAdmin.data = null;
  pedidosAdmin.dias = {};
  clearInterval(aoVivo.temporizador);
  aoVivo.versao = null;
  aoVivo.pedidos = null;
  aoVivo.pedidoEmpresa = null;
  aoVivo.prazos = null;
  aoVivo.ocupado = false;
});

window.addEventListener('beforeunload', function(evento) {
  if (pedidoEmpresa.alterado) {
    evento.preventDefault();
    evento.returnValue = '';
  }
});

function carregarPedidoEmpresa() {
  const conteudo = $('pedidoEmpresaConteudo');

  if (pedidoEmpresa.estado && pedidoEmpresa.alterado) {
    renderizarPedidoEmpresa();
    return;
  }

  if (!pedidoEmpresa.estado) mostrarCarregandoLista(conteudo, 4);

  apiSessao('obterPedidoEmpresa')
    .then(function(estadoServidor) {
      aplicarEstadoPedidoEmpresa(estadoServidor);
      if (estado.telaAtual === 'pedidos-empresa') renderizarPedidoEmpresa();
    })
    .catch(function(erro) {
      falhaAoAtualizar(conteudo, erro, carregarPedidoEmpresa, !!pedidoEmpresa.estado);
    });
}

// Copia o pedido salvo para a seleção da tela
function aplicarEstadoPedidoEmpresa(estadoServidor) {
  pedidoEmpresa.estado = estadoServidor;
  pedidoEmpresa.recebidoEm = Date.now();
  pedidoEmpresa.selecao = {};
  pedidoEmpresa.avulsas = [];
  pedidoEmpresa.faltando = {};
  pedidoEmpresa.alterado = false;
  pedidoEmpresa.observacoes = estadoServidor.pedido ? estadoServidor.pedido.observacoes : '';

  if (estadoServidor.pedido && estadoServidor.pedido.status !== 'CANCELADO') {
    estadoServidor.pedido.itens.forEach(function(item) {
      if (item.avulsa) {
        pedidoEmpresa.avulsas.push({
          chave: proximaChaveAvulsa++,
          nome: item.nome,
          proteina: item.padrao ? '' : item.proteina,
          opcao_extra: item.opcao_extra
        });
      } else {
        pedidoEmpresa.selecao[item.funcionario_id] = {
          proteina: item.padrao ? '' : item.proteina,
          opcao_extra: item.opcao_extra,
          itens_removidos: item.itens_removidos.slice(),
          observacao: item.observacao
        };
      }
    });
  }

  if (typeof resumoEmpresa !== 'undefined') resumoEmpresa = null;
}

function podeEditarPedido() {
  const e = pedidoEmpresa.estado;
  return !!(e && e.prazo.aberto && e.cardapio && e.tem_preco);
}

// Quem escolhe a proteína (conforme a configuração da empresa)
function funcionarioEscolhe(funcionarioId) {
  const f = pedidoEmpresa.estado.funcionarios.find(function(x) { return x.funcionario_id === funcionarioId; });
  return !!(f && f.escolhe);
}

function alguemEscolhe() {
  const e = pedidoEmpresa.estado;
  return e.funcionarios.some(function(f) { return f.escolhe; }) || (e.config.avulsas && e.config.avulsa_escolhe);
}

function criarQuentinhaDoDia() {
  const caixa = el('div', 'quentinha-do-dia');
  caixa.innerHTML = icone('cardapio');
  caixa.appendChild(el('span', '', 'Quentinha do dia'));
  return caixa;
}

// O proprietário mudou a configuração: refaz a tela do pedido, se nada foi alterado
AO_MUDAR_RECURSOS.push(function() {
  if (estado.telaAtual === 'pedidos-empresa' && !pedidoEmpresa.alterado) carregarPedidoEmpresa();
  if (estado.telaAtual === 'inicio-empresa' && typeof carregarInicioEmpresa === 'function') carregarInicioEmpresa();
});

function marcarPedidoAlterado() {
  pedidoEmpresa.alterado = true;
  atualizarBarraPedido();
}

function quantidadeSelecionada() {
  return Object.keys(pedidoEmpresa.selecao).length + pedidoEmpresa.avulsas.length;
}

// ---------- TELA ----------
function renderizarPedidoEmpresa() {
  const e = pedidoEmpresa.estado;
  const conteudo = $('pedidoEmpresaConteudo');
  conteudo.innerHTML = '';

  conteudo.appendChild(criarCabecalhoPedidoEmpresa());

  // Passou do horário: pode pedir mais prazo ao restaurante
  if (podePedirPrazoExtra()) conteudo.appendChild(criarCartaoPrazoExtra());

  // Sem cardápio ou sem preço: não dá para pedir
  if (!e.cardapio) {
    conteudo.appendChild(estadoVazio({
      icone: 'cardapio',
      titulo: 'Sem cardápio para hoje',
      texto: e.prazo.motivo && !e.prazo.aberto
        ? e.prazo.motivo
        : 'O restaurante ainda não publicou o cardápio de hoje. Assim que ele publicar, você poderá fazer o pedido.'
    }));
    return;
  }

  if (!e.tem_preco && !e.pedido) {
    conteudo.appendChild(criarAlerta(e.config.mostrar_precos
      ? 'O restaurante ainda não definiu o valor da quentinha da sua empresa. Entre em contato com ele.'
      : 'O restaurante ainda não liberou os pedidos da sua empresa. Entre em contato com ele.'));
    return;
  }

  if (!podeEditarPedido() && !e.pedido) {
    conteudo.appendChild(estadoVazio({
      icone: 'pedido',
      titulo: 'Nenhum pedido hoje',
      texto: e.prazo.motivo || 'Os pedidos de hoje estão encerrados.'
    }));
    return;
  }

  conteudo.appendChild(criarResumoCardapioHoje());

  if (podeEditarPedido()) conteudo.appendChild(criarFerramentasPedido());

  const lista = el('div', 'lista-pedido');
  lista.id = 'listaPessoasPedido';
  conteudo.appendChild(lista);
  renderizarPessoasPedido();

  if (e.config.avulsas || pedidoEmpresa.avulsas.length) conteudo.appendChild(criarSecaoAvulsas());
  conteudo.appendChild(criarObservacaoPedido());

  const barra = el('div', 'barra-pedido');
  barra.id = 'barraPedido';
  conteudo.appendChild(barra);
  atualizarBarraPedido();
}

function criarCabecalhoPedidoEmpresa() {
  const e = pedidoEmpresa.estado;
  const cartao = el('div', 'cartao cabecalho-pedido');

  const linha = el('div', 'cabecalho-pedido-linha');
  const textos = el('div');
  textos.appendChild(el('h2', '', 'Pedido de ' + nomeDoDiaCompleto(e.prazo.hoje).toLowerCase()));

  const prazo = el('p', 'subtitulo-cartao');
  if (e.prazo.aberto && e.prazo.prazo_extra) {
    prazo.textContent = 'Prazo extra liberado pelo restaurante: você pode enviar ou alterar até ' + e.prazo.limite + ' (' +
      tempoRestante(e.prazo, pedidoEmpresa.recebidoEm) + ').';
  } else if (e.prazo.aberto) {
    prazo.textContent = 'Você pode enviar ou alterar até ' + e.prazo.limite + ' (' +
      tempoRestante(e.prazo, pedidoEmpresa.recebidoEm) + ').';
  } else {
    prazo.textContent = e.prazo.motivo;
  }
  textos.appendChild(prazo);
  linha.appendChild(textos);

  if (e.pedido) {
    linha.appendChild(etiquetaPedido(e.pedido.status));
  } else if (podeEditarPedido()) {
    linha.appendChild(criarEtiqueta('Ainda não enviado', 'cinza'));
  }

  cartao.appendChild(linha);

  if (e.pedido && e.pedido.status === 'RECUSADO') {
    const motivo = (e.pedido.resposta_restaurante || 'sem motivo informado').replace(/[.!?]*$/, '.');
    cartao.appendChild(criarAlerta('O restaurante recusou o pedido: ' + motivo +
      (e.prazo.aberto ? ' Você pode ajustar e enviar de novo.' : ''), { icone: 'alerta' }));
  } else if (e.pedido && e.pedido.alterado_apos_confirmacao) {
    cartao.appendChild(criarAlerta('Você alterou o pedido depois da confirmação. O restaurante vai confirmar de novo.', { tipo: 'info', icone: 'pedido' }));
  } else if (e.pedido && e.pedido.status === 'CONFIRMADO') {
    cartao.appendChild(criarAlerta('Pedido confirmado pelo restaurante às ' + horaDe(e.pedido.confirmado_em) + '.', { tipo: 'ok', icone: 'check' }));
  }

  return cartao;
}

// ---------- PRAZO EXTRA (empresa) ----------
// Passou do horário limite, há cardápio e preço: dá para pedir mais prazo
function podePedirPrazoExtra() {
  const e = pedidoEmpresa.estado;
  return !!(e && !e.prazo.aberto && e.prazo.encerrado_por_horario && e.cardapio && e.tem_preco && e.prazo_extra);
}

function criarCartaoPrazoExtra() {
  const e = pedidoEmpresa.estado;
  const situacao = e.prazo_extra;
  const minutos = e.minutos_prazo_extra || 30;
  const cartao = el('div', 'cartao cartao-prazo-extra');

  if (situacao.status === 'PENDENTE') {
    cartao.appendChild(criarAlerta('Você pediu mais prazo às ' + horaDe(situacao.solicitado_em) +
      '. Aguardando o restaurante responder — avisaremos aqui.', { tipo: 'info', icone: 'alerta' }));
    return cartao;
  }

  if (situacao.status === 'RECUSADO') {
    cartao.appendChild(criarAlerta('O restaurante não liberou mais prazo' +
      (situacao.resposta ? ': ' + situacao.resposta.replace(/[.!?]*$/, '.') : '.'), { icone: 'alerta' }));
  } else if (situacao.status === 'ENCERRADO') {
    cartao.appendChild(criarAlerta('O prazo extra liberado pelo restaurante terminou às ' + situacao.liberado_ate_texto + '.', { tipo: 'info', icone: 'alerta' }));
  }

  if (!situacao.pode_pedir) return cartao;

  cartao.appendChild(el('h3', 'titulo-secao', 'Precisa fazer ou mudar o pedido?'));
  cartao.appendChild(el('p', 'texto-apoio',
    'O horário de hoje acabou às ' + e.prazo.limite_normal + '. Peça ao restaurante mais ' + minutos +
    ' minutos. Se ele liberar, você terá ' + minutos + ' minutos para enviar ou alterar o pedido (vale só para hoje).'));

  const linha = el('div', 'prazo-extra-linha');
  const campo = el('input');
  campo.type = 'text';
  campo.maxLength = 200;
  campo.placeholder = 'Mensagem para o restaurante (opcional)';
  campo.id = 'mensagemPrazoExtra';
  linha.appendChild(campo);

  const botao = criarBotao('Pedir mais ' + minutos + ' minutos', {
    classe: 'botao-primario', icone: 'alerta',
    aoClicar: function() {
      comCarregamento(botao, apiSessao('solicitarPrazoExtra', campo.value))
        .then(function(resposta) {
          aplicarEstadoPedidoEmpresa(resposta.estado);
          renderizarPedidoEmpresa();
          avisar(resposta.mensagem);
        })
        .catch(function(erro) { avisar(erro.message, 'erro'); });
    }
  });
  linha.appendChild(botao);
  cartao.appendChild(linha);
  return cartao;
}

function criarResumoCardapioHoje() {
  const e = pedidoEmpresa.estado;
  const caixa = el('div', 'resumo-cardapio-hoje');

  caixa.appendChild(el('strong', '', 'Hoje: '));
  caixa.appendChild(document.createTextNode(e.cardapio.proteinas.join(' ou ') || 'quentinha do dia'));

  const acompanha = e.cardapio.acompanhamentos.concat(e.cardapio.saladas, e.cardapio.guarnicoes);
  if (acompanha.length) {
    caixa.appendChild(el('span', 'resumo-cardapio-detalhe', ' · acompanha ' + acompanha.join(', ')));
  }

  if (e.preco_unitario !== null) {
    caixa.appendChild(el('span', 'resumo-cardapio-detalhe', ' · ' + formatarMoeda(e.preco_unitario) + ' cada'));
  }

  return caixa;
}

// ---------- FERRAMENTAS (busca e atalhos) ----------
function criarFerramentasPedido() {
  const e = pedidoEmpresa.estado;
  const caixa = el('div', 'ferramentas');

  const busca = el('div', 'campo-busca');
  busca.innerHTML = icone('busca');
  const campo = el('input');
  campo.type = 'search';
  campo.placeholder = 'Buscar funcionário';
  campo.value = pedidoEmpresa.busca;
  campo.addEventListener('input', function() {
    pedidoEmpresa.busca = campo.value;
    renderizarPessoasPedido();
  });
  busca.appendChild(campo);
  caixa.appendChild(busca);

  caixa.appendChild(criarBotao('Marcar todos', {
    classe: 'botao-secundario',
    aoClicar: function() {
      e.funcionarios.forEach(function(f) {
        if (!pedidoEmpresa.selecao[f.funcionario_id]) pedidoEmpresa.selecao[f.funcionario_id] = novaEscolha(f.escolhe);
      });
      marcarPedidoAlterado();
      renderizarPessoasPedido();
    }
  }));

  if (e.ultimo_pedido && e.ultimo_pedido.funcionarios.length) {
    caixa.appendChild(criarBotao('Repetir quem pediu em ' + formatarData(e.ultimo_pedido.data_entrega).slice(0, 5), {
      classe: 'botao-secundario',
      aoClicar: function() {
        const ativos = {};
        e.funcionarios.forEach(function(f) { ativos[f.funcionario_id] = true; });
        pedidoEmpresa.selecao = {};
        e.ultimo_pedido.funcionarios.forEach(function(id) {
          if (ativos[id]) pedidoEmpresa.selecao[id] = novaEscolha(funcionarioEscolhe(id));
        });
        marcarPedidoAlterado();
        renderizarPessoasPedido();
        avisar(alguemEscolhe()
          ? 'Marcamos quem pediu no último dia. Agora é só escolher as proteínas.'
          : 'Marcamos quem pediu no último dia.');
      }
    }));
  }

  if (e.cardapio.proteinas.length > 1 && alguemEscolhe()) {
    const todos = el('div', 'proteina-para-todos');
    todos.appendChild(el('span', '', 'Proteína para quem ainda não escolheu:'));
    todos.appendChild(criarEscolha(
      e.cardapio.proteinas.map(function(p) { return { valor: p, texto: p }; }),
      null,
      function(proteina) {
        let alterados = 0;
        Object.keys(pedidoEmpresa.selecao).forEach(function(id) {
          if (funcionarioEscolhe(id) && !pedidoEmpresa.selecao[id].proteina) {
            pedidoEmpresa.selecao[id].proteina = proteina;
            alterados++;
          }
        });
        if (e.config.avulsa_escolhe) {
          pedidoEmpresa.avulsas.forEach(function(a) {
            if (!a.proteina) { a.proteina = proteina; alterados++; }
          });
        }
        if (!alterados) {
          avisar('Todos os marcados já têm proteína escolhida.', 'erro');
          return;
        }
        pedidoEmpresa.faltando = {};
        marcarPedidoAlterado();
        renderizarPessoasPedido();
        renderizarAvulsas();
      }
    ));
    caixa.appendChild(todos);
  }

  return caixa;
}

function novaEscolha(escolhe) {
  const e = pedidoEmpresa.estado;
  return {
    proteina: escolhe !== false && e.cardapio.proteinas.length === 1 ? e.cardapio.proteinas[0] : '',
    opcao_extra: '',
    itens_removidos: [],
    observacao: ''
  };
}

// ---------- LISTA DE FUNCIONÁRIOS ----------
function renderizarPessoasPedido() {
  const lista = document.getElementById('listaPessoasPedido');
  if (!lista) return;

  const e = pedidoEmpresa.estado;
  const editavel = podeEditarPedido();
  const termo = normalizarBusca(pedidoEmpresa.busca);
  lista.innerHTML = '';

  // Fora do prazo, mostra só quem está no pedido
  let pessoas = e.funcionarios.filter(function(f) {
    if (!editavel && !pedidoEmpresa.selecao[f.funcionario_id]) return false;
    if (!termo) return true;
    return normalizarBusca(f.nome + ' ' + f.setor + ' ' + f.matricula).indexOf(termo) !== -1;
  });

  if (!e.funcionarios.length) {
    lista.appendChild(estadoVazio({
      icone: 'pessoas',
      titulo: 'Nenhum funcionário cadastrado',
      texto: 'O restaurante ainda não cadastrou os funcionários da sua empresa. Você pode usar as quentinhas avulsas abaixo.'
    }));
    return;
  }

  if (!pessoas.length) {
    lista.appendChild(el('div', 'contador', termo ? 'Nenhum funcionário encontrado.' : 'Nenhum funcionário no pedido.'));
    return;
  }

  pessoas.forEach(function(f) { lista.appendChild(criarLinhaPessoa(f)); });
}

function criarLinhaPessoa(funcionario) {
  const e = pedidoEmpresa.estado;
  const editavel = podeEditarPedido();
  const escolha = pedidoEmpresa.selecao[funcionario.funcionario_id];
  const id = funcionario.funcionario_id;

  const linha = el('div', 'pessoa-pedido' + (escolha ? ' marcada' : '') + (pedidoEmpresa.faltando[id] ? ' faltando' : ''));
  linha.dataset.funcionario = id;

  // Marcar / desmarcar
  const topo = el('label', 'pessoa-topo');
  const marcar = el('input');
  marcar.type = 'checkbox';
  marcar.checked = !!escolha;
  marcar.disabled = !editavel;
  marcar.addEventListener('change', function() {
    if (marcar.checked) {
      pedidoEmpresa.selecao[id] = novaEscolha(funcionario.escolhe);
    } else {
      delete pedidoEmpresa.selecao[id];
      delete pedidoEmpresa.faltando[id];
    }
    marcarPedidoAlterado();
    atualizarLinhaPessoa(funcionario);
  });
  topo.appendChild(marcar);

  const nome = el('div', 'pessoa-nome');
  nome.appendChild(el('strong', '', funcionario.nome));
  if (funcionario.setor) nome.appendChild(el('span', '', funcionario.setor));
  topo.appendChild(nome);

  if (funcionario.personaliza) topo.appendChild(criarEtiqueta('Personaliza', 'azul'));
  else if (funcionario.escolhe && e.config.escolha !== 'TODOS') topo.appendChild(criarEtiqueta('Escolhe', 'azul'));
  linha.appendChild(topo);

  if (!escolha) return linha;

  // Escolhas da quentinha
  const detalhes = el('div', 'pessoa-detalhes');

  // Quem não escolhe recebe a quentinha do dia
  if (!funcionario.escolhe) {
    detalhes.appendChild(criarQuentinhaDoDia());
    linha.appendChild(detalhes);
    return linha;
  }

  detalhes.appendChild(criarEscolha(
    e.cardapio.proteinas.map(function(p) { return { valor: p, texto: p }; }),
    escolha.proteina,
    function(proteina) {
      escolha.proteina = proteina;
      delete pedidoEmpresa.faltando[id];
      marcarPedidoAlterado();
      atualizarLinhaPessoa(funcionario);
    },
    !editavel
  ));

  if (e.opcoes_extra.length) {
    const opcoesExtra = [{ valor: '', texto: 'Sem extra' }].concat(
      e.opcoes_extra.map(function(o) { return { valor: o, texto: o }; })
    );
    const extra = criarEscolha(opcoesExtra, escolha.opcao_extra || '', function(valor) {
      escolha.opcao_extra = valor;
      marcarPedidoAlterado();
      atualizarLinhaPessoa(funcionario);
    }, !editavel);
    extra.classList.add('extras');
    detalhes.appendChild(extra);
  }

  // Personalização (só para quem tem permissão)
  if (funcionario.personaliza) {
    const personalizacao = el('div', 'personalizacao');
    const resumo = [];
    if (escolha.itens_removidos.length) resumo.push('Sem ' + escolha.itens_removidos.join(', ').toLowerCase());
    if (escolha.observacao) resumo.push('Obs.: ' + escolha.observacao);

    personalizacao.appendChild(el('span', '', resumo.length ? resumo.join(' · ') : 'Sem personalização'));

    if (editavel) {
      personalizacao.appendChild(criarBotao('Personalizar', {
        classe: 'botao-fantasma botao-pequeno', icone: 'editar',
        aoClicar: function() { abrirPersonalizacao(funcionario); }
      }));
    }

    detalhes.appendChild(personalizacao);
  }

  linha.appendChild(detalhes);
  return linha;
}

function atualizarLinhaPessoa(funcionario) {
  const lista = document.getElementById('listaPessoasPedido');
  const antiga = lista.querySelector('[data-funcionario="' + funcionario.funcionario_id + '"]');
  if (antiga) lista.replaceChild(criarLinhaPessoa(funcionario), antiga);
}

// Janela para remover itens e escrever observação
function abrirPersonalizacao(funcionario) {
  const e = pedidoEmpresa.estado;
  const escolha = pedidoEmpresa.selecao[funcionario.funcionario_id];
  const form = el('form');
  form.noValidate = true;

  form.appendChild(el('p', 'texto-apoio', 'Desmarque o que ' + primeiroNome(funcionario.nome) + ' não quer na quentinha.'));

  const grupos = [
    { titulo: 'Acompanhamento', itens: e.cardapio.acompanhamentos },
    { titulo: 'Salada', itens: e.cardapio.saladas },
    { titulo: 'Guarnição', itens: e.cardapio.guarnicoes }
  ];

  const marcadores = [];

  grupos.forEach(function(grupo) {
    if (!grupo.itens.length) return;
    form.appendChild(el('div', 'grupo-titulo', grupo.titulo));
    const caixa = el('div', 'itens-personalizar');

    grupo.itens.forEach(function(item) {
      const rotulo = el('label', 'item-personalizar');
      const marcar = el('input');
      marcar.type = 'checkbox';
      marcar.checked = escolha.itens_removidos.indexOf(item) === -1;
      marcar.dataset.item = item;
      marcadores.push(marcar);
      rotulo.appendChild(marcar);
      rotulo.appendChild(el('span', '', item));
      caixa.appendChild(rotulo);
    });

    form.appendChild(caixa);
  });

  const campo = el('div', 'campo');
  campo.appendChild(el('label', '', 'Observação (opcional)'));
  const observacao = el('textarea');
  observacao.maxLength = 200;
  observacao.placeholder = 'Ex.: pouco sal, mais arroz';
  observacao.value = escolha.observacao || '';
  campo.appendChild(observacao);
  form.appendChild(campo);

  const rodape = el('div', 'modal-rodape');
  rodape.appendChild(criarBotao('Cancelar', { classe: 'botao-secundario', aoClicar: fecharModal }));
  const salvar = criarBotao('Aplicar', { classe: 'botao-primario' });
  salvar.type = 'submit';
  rodape.appendChild(salvar);
  form.appendChild(rodape);

  form.addEventListener('submit', function(evento) {
    evento.preventDefault();
    escolha.itens_removidos = marcadores.filter(function(m) { return !m.checked; }).map(function(m) { return m.dataset.item; });
    escolha.observacao = observacao.value.trim();
    fecharModal();
    marcarPedidoAlterado();
    atualizarLinhaPessoa(funcionario);
  });

  abrirModal('Personalizar a quentinha de ' + primeiroNome(funcionario.nome), form, { pequeno: true });
}

// ---------- AVULSAS ----------
function criarSecaoAvulsas() {
  const secao = el('div', 'secao-avulsas');
  secao.id = 'secaoAvulsas';
  renderizarAvulsas(secao);
  return secao;
}

function renderizarAvulsas(secao) {
  secao = secao || document.getElementById('secaoAvulsas');
  if (!secao) return;

  const e = pedidoEmpresa.estado;
  const editavel = podeEditarPedido();
  secao.innerHTML = '';

  if (!editavel && !pedidoEmpresa.avulsas.length) return;

  const titulo = el('div', 'secao-avulsas-topo');
  titulo.appendChild(el('h3', '', 'Quentinhas avulsas'));
  titulo.appendChild(el('span', 'contador', 'Para visitantes ou quem não está cadastrado.'));
  secao.appendChild(titulo);

  pedidoEmpresa.avulsas.forEach(function(avulsa) {
    const linha = el('div', 'pessoa-pedido marcada avulsa' + (pedidoEmpresa.faltando['avulsa-' + avulsa.chave] ? ' faltando' : ''));

    const topo = el('div', 'pessoa-topo');
    const nome = el('input', 'campo-item');
    nome.placeholder = 'Nome (ex.: Visitante – João)';
    nome.maxLength = 80;
    nome.value = avulsa.nome;
    nome.disabled = !editavel;
    nome.addEventListener('input', function() {
      avulsa.nome = nome.value;
      marcarPedidoAlterado();
    });
    topo.appendChild(nome);

    if (editavel) {
      const remover = el('button', 'botao-icone pequeno');
      remover.type = 'button';
      remover.title = 'Remover avulsa';
      remover.innerHTML = icone('fechar');
      remover.addEventListener('click', function() {
        pedidoEmpresa.avulsas = pedidoEmpresa.avulsas.filter(function(a) { return a !== avulsa; });
        marcarPedidoAlterado();
        renderizarAvulsas();
      });
      topo.appendChild(remover);
    }

    linha.appendChild(topo);

    const detalhes = el('div', 'pessoa-detalhes');

    if (!e.config.avulsa_escolhe) {
      detalhes.appendChild(criarQuentinhaDoDia());
      linha.appendChild(detalhes);
      secao.appendChild(linha);
      return;
    }

    detalhes.appendChild(criarEscolha(
      e.cardapio.proteinas.map(function(p) { return { valor: p, texto: p }; }),
      avulsa.proteina,
      function(proteina) {
        avulsa.proteina = proteina;
        delete pedidoEmpresa.faltando['avulsa-' + avulsa.chave];
        marcarPedidoAlterado();
        renderizarAvulsas();
      },
      !editavel
    ));

    if (e.opcoes_extra.length) {
      const extra = criarEscolha(
        [{ valor: '', texto: 'Sem extra' }].concat(e.opcoes_extra.map(function(o) { return { valor: o, texto: o }; })),
        avulsa.opcao_extra || '',
        function(valor) {
          avulsa.opcao_extra = valor;
          marcarPedidoAlterado();
          renderizarAvulsas();
        },
        !editavel
      );
      extra.classList.add('extras');
      detalhes.appendChild(extra);
    }

    linha.appendChild(detalhes);
    secao.appendChild(linha);
  });

  if (editavel && e.config.avulsas) {
    secao.appendChild(criarBotao('Adicionar quentinha avulsa', {
      classe: 'botao-secundario', icone: 'adicionar',
      aoClicar: function() {
        pedidoEmpresa.avulsas.push({
          chave: proximaChaveAvulsa++,
          nome: '',
          proteina: e.config.avulsa_escolhe && e.cardapio.proteinas.length === 1 ? e.cardapio.proteinas[0] : '',
          opcao_extra: ''
        });
        marcarPedidoAlterado();
        renderizarAvulsas();
        const campos = document.querySelectorAll('#secaoAvulsas input.campo-item');
        if (campos.length) campos[campos.length - 1].focus();
      }
    }));
  }
}

function criarObservacaoPedido() {

  const campo = el('div', 'campo observacao-pedido');

  if (!editavel && !pedidoEmpresa.observacoes) return campo;

// ---------- BARRA DE ENVIO ----------
function atualizarBarraPedido() {
  const barra = document.getElementById('barraPedido');
  if (!barra) return;

  const e = pedidoEmpresa.estado;
  const editavel = podeEditarPedido();
  const quantidade = quantidadeSelecionada();
  const preco = e.pedido && !editavel
    ? (e.pedido.quantidade_total ? e.pedido.valor_total / e.pedido.quantidade_total : 0)
    : (e.preco_unitario || 0);

  barra.innerHTML = '';

  const resumo = el('div', 'barra-pedido-resumo');
  resumo.appendChild(el('strong', '', quantidade + (quantidade === 1 ? ' quentinha' : ' quentinhas')));
  const partes = [];
  if (e.config.mostrar_precos && e.preco_unitario !== null) partes.push(formatarMoeda(quantidade * preco));
  if (pedidoEmpresa.alterado) partes.push('alterações não enviadas');
  if (partes.length) resumo.appendChild(el('span', '', partes.join(' · ')));
  barra.appendChild(resumo);

  if (!editavel) return;

  const acoes = el('div', 'barra-pedido-acoes');

  if (e.pedido && e.pedido.status !== 'CANCELADO') {
    acoes.appendChild(criarBotao('Cancelar pedido', {
      classe: 'botao-fantasma botao-texto-perigo',
      aoClicar: function(evento) { cancelarPedidoHoje(evento.currentTarget); }
    }));
  }

  const enviar = criarBotao(e.pedido && e.pedido.status !== 'CANCELADO' ? 'Salvar alterações' : 'Enviar pedido', {
    classe: 'botao-primario', icone: 'check',
    aoClicar: function(evento) { enviarPedidoHoje(evento.currentTarget); }
  });
  enviar.disabled = !pedidoEmpresa.alterado && !!e.pedido && e.pedido.status !== 'RECUSADO' && e.pedido.status !== 'CANCELADO';
  acoes.appendChild(enviar);

  barra.appendChild(acoes);
}

function enviarPedidoHoje(botao) {
  const e = pedidoEmpresa.estado;
  const nomes = {};
  e.funcionarios.forEach(function(f) { nomes[f.funcionario_id] = f.nome; });

  // Confere antes de enviar: todos precisam de proteína
  const faltando = {};
  const nomesFaltando = [];

  Object.keys(pedidoEmpresa.selecao).forEach(function(id) {
    if (funcionarioEscolhe(id) && !pedidoEmpresa.selecao[id].proteina) {
      faltando[id] = true;
      nomesFaltando.push(nomes[id]);
    }
  });

  pedidoEmpresa.avulsas.forEach(function(a) {
    if ((e.config.avulsa_escolhe && !a.proteina) || a.nome.trim().length < 2) {
      faltando['avulsa-' + a.chave] = true;
      nomesFaltando.push(a.nome.trim() || 'avulsa sem nome');
    }
  });

  pedidoEmpresa.faltando = faltando;

  if (nomesFaltando.length) {
    renderizarPessoasPedido();
    renderizarAvulsas();
    const primeiro = document.querySelector('.pessoa-pedido.faltando');
    if (primeiro) primeiro.scrollIntoView({ block: 'center', behavior: 'smooth' });
    avisar((alguemEscolhe() ? 'Escolha a proteína (e o nome, nas avulsas) de: ' : 'Informe o nome das avulsas: ') + nomesFaltando.slice(0, 3).join(', ') +
      (nomesFaltando.length > 3 ? ' e mais ' + (nomesFaltando.length - 3) : '') + '.', 'erro');
    return;
  }

  if (!quantidadeSelecionada()) {
    avisar('Marque pelo menos uma pessoa para enviar o pedido.', 'erro');
    return;
  }

  const dados = {
    observacoes: pedidoEmpresa.observacoes,
    // versão do pedido que esta tela tinha (evita sobrescrever outra aba)
    base_atualizado_em: e.pedido ? e.pedido.atualizado_em : null,
    itens: Object.keys(pedidoEmpresa.selecao).map(function(id) {
      const escolha = pedidoEmpresa.selecao[id];
      return {
        funcionario_id: id,
        proteina: escolha.proteina,
        opcao_extra: escolha.opcao_extra,
        itens_removidos: escolha.itens_removidos,
        observacao: escolha.observacao
      };
    }).concat(pedidoEmpresa.avulsas.map(function(a) {
      return { funcionario_id: '', nome: a.nome.trim(), proteina: a.proteina, opcao_extra: a.opcao_extra };
    }))
  };

  comCarregamento(botao, apiSessao('salvarPedidoEmpresa', dados))
    .then(function(resposta) {
      aplicarEstadoPedidoEmpresa(resposta.estado);
      renderizarPedidoEmpresa();
      avisar(resposta.mensagem);
    })
    .catch(function(erro) {
      avisar(erro.message, 'erro');
      if (/encerrad|passou|liberado|outra tela/.test(erro.message)) {
        pedidoEmpresa.alterado = false;
        carregarPedidoEmpresa();
      }
    });
}

function cancelarPedidoHoje(botao) {
  confirmar({
    titulo: 'Cancelar o pedido de hoje?',
    mensagem: 'Nenhuma quentinha será preparada para a sua empresa hoje. Até ' + pedidoEmpresa.estado.prazo.limite +
      ' você ainda pode fazer um novo pedido.',
    textoBotao: 'Cancelar pedido',
    textoCancelar: 'Voltar',
    perigo: true
  }).then(function(sim) {
    if (!sim) return;

    comCarregamento(botao, apiSessao('cancelarPedidoEmpresa'))
      .then(function(resposta) {
        aplicarEstadoPedidoEmpresa(resposta.estado);
        renderizarPedidoEmpresa();
        avisar(resposta.mensagem);
      })
      .catch(function(erro) { avisar(erro.message, 'erro'); });
  });
}

// Cartão "Pedido de hoje" na tela inicial da empresa
function renderizarPedidoHojeEmpresa(resumo) {
  const caixa = $('pedidoHojeEmpresa');
  caixa.innerHTML = '';
  if (!resumo) return;

  $('subtituloPedidoHojeEmpresa').textContent = resumo.prazo.aberto
    ? (resumo.prazo.prazo_extra ? 'Prazo extra: envie ou altere até ' : 'Envie ou altere até ') + resumo.prazo.limite + '.'
    : resumo.prazo.motivo;

  if (resumo.status) {
    const linha = el('div', 'linha-resumo-pedido');
    linha.appendChild(el('strong', '', resumo.quantidade + (resumo.quantidade === 1 ? ' quentinha' : ' quentinhas')));
    linha.appendChild(etiquetaPedido(resumo.status));
    caixa.appendChild(linha);

    if (resumo.status === 'RECUSADO' && resumo.resposta_restaurante) {
      caixa.appendChild(criarAlerta('Motivo: ' + resumo.resposta_restaurante));
    }
  } else if (resumo.prazo.aberto && resumo.cardapio_publicado) {
    caixa.appendChild(criarAlerta('Você ainda não fez o pedido de hoje.', { tipo: 'info', icone: 'pedido' }));
  } else if (!resumo.cardapio_publicado && resumo.prazo.aberto) {
    caixa.appendChild(criarAlerta('O cardápio de hoje ainda não foi publicado.', { tipo: 'info', icone: 'cardapio' }));
  }

  // Passou do horário: pedir mais prazo (ou aguardar a resposta)
  const extra = resumo.prazo_extra;
  if (!resumo.prazo.aberto && resumo.prazo.encerrado_por_horario && resumo.cardapio_publicado && extra) {
    if (extra.status === 'PENDENTE') {
      caixa.appendChild(criarAlerta('Você pediu mais prazo. Aguardando o restaurante responder.', { tipo: 'info', icone: 'alerta' }));
    } else if (extra.pode_pedir) {
      caixa.appendChild(criarBotao('Pedir mais prazo ao restaurante', {
        classe: 'botao-secundario botao-largo', icone: 'alerta',
        aoClicar: function() { irPara('pedidos-empresa'); }
      }));
    }
  }

  if (resumo.prazo.aberto && resumo.cardapio_publicado) {
    caixa.appendChild(criarBotao(resumo.status ? 'Ver ou alterar o pedido' : 'Fazer o pedido de hoje', {
      classe: 'botao-primario botao-largo', icone: 'pedido',
      aoClicar: function() { irPara('pedidos-empresa'); }
    }));
  } else if (resumo.status) {
    caixa.appendChild(criarBotao('Ver o pedido', {
      classe: 'botao-secundario botao-largo', icone: 'pedido',
      aoClicar: function() { irPara('pedidos-empresa'); }
    }));
  }
}

// RESTAURANTE: PEDIDOS DO DIA
// ================================================================
const pedidosAdmin = {
  data: null,
  dias: {}         // { data: { dia, em } }
};

TELAS['pedidos'] = {
  carregar: function(parametros) {
    abrirPedidosDia(parametros.data || pedidosAdmin.data || hojeTexto());
  }
};

function abrirPedidosDia(data) {
  pedidosAdmin.data = data;
  const guardado = pedidosAdmin.dias[data];

  if (guardado) {
    renderizarPedidosDia(guardado.dia);
  } else {
    $('pedidosTopo').innerHTML = '';
    $('pedidosTopo').appendChild(criarNavegacaoDia(data));
    mostrarCarregandoLista($('pedidosConteudo'), 4);
  }

  // Pedidos mudam o tempo todo: sempre busca a versão mais nova
  // (o que estava na memória aparece na hora, enquanto isso)
  buscarPedidosDia(data, !!guardado);
}

function buscarPedidosDia(data, silencioso) {
  return apiSessao('listarPedidosDia', data)
    .then(function(dia) {
      pedidosAdmin.dias[data] = { dia: dia, em: Date.now() };
      if (estado.telaAtual === 'pedidos' && pedidosAdmin.data === data) renderizarPedidosDia(dia);
    })
    .catch(function(erro) {
      if (silencioso) return;
      falhaAoAtualizar($('pedidosConteudo'), erro, function() { abrirPedidosDia(data); }, !!pedidosAdmin.dias[data]);
    });
}

function aplicarDiaAtualizado(dia) {
  if (!dia) return;
  pedidosAdmin.dias[dia.data] = { dia: dia, em: Date.now() };
  if (typeof resumoAdmin !== 'undefined') resumoAdmin = null;
  if (estado.telaAtual === 'pedidos' && pedidosAdmin.data === dia.data) renderizarPedidosDia(dia);
}

function criarNavegacaoDia(data) {
  const nav = el('div', 'semana-nav');

  const anterior = el('button', 'botao-icone');
  anterior.type = 'button';
  anterior.title = 'Dia anterior';
  anterior.innerHTML = icone('anterior');
  anterior.addEventListener('click', function() { abrirPedidosDia(somarDias(data, -1)); });

  const proximo = el('button', 'botao-icone');
  proximo.type = 'button';
  proximo.title = 'Próximo dia';
  proximo.innerHTML = icone('proximo');
  proximo.addEventListener('click', function() { abrirPedidosDia(somarDias(data, 1)); });

  const textos = el('div', 'semana-textos');
  textos.appendChild(el('strong', '', nomeDoDiaCompleto(data)));
  textos.appendChild(el('span', '', data === hojeTexto() ? 'Hoje' : formatarData(data)));

  nav.appendChild(anterior);
  nav.appendChild(textos);
  nav.appendChild(proximo);

  if (data !== hojeTexto()) {
    nav.appendChild(criarBotao('Hoje', {
      classe: 'botao-fantasma botao-pequeno',
      aoClicar: function() { abrirPedidosDia(hojeTexto()); }
    }));
  }

  return nav;
}

function renderizarPedidosDia(dia) {
  const topo = $('pedidosTopo');
  const conteudo = $('pedidosConteudo');

  topo.innerHTML = '';
  topo.appendChild(criarNavegacaoDia(dia.data));

  const prazo = el('div', 'prazo-pedidos');
  if (dia.data === hojeTexto()) prazo.appendChild(criarIndicadorAoVivo());
  prazo.appendChild(el('span', '', dia.prazo.aberto
    ? 'Recebendo pedidos até ' + dia.prazo.limite
    : (dia.data === dia.prazo.hoje ? 'Pedidos encerrados (limite ' + dia.prazo.limite + ')' : 'Limite diário: ' + dia.prazo.limite)));
  if (podeFazer('pedidos_horario')) {
    prazo.appendChild(criarBotao('Alterar horário', {
      classe: 'botao-fantasma botao-pequeno',
      aoClicar: abrirHorarioLimite
    }));
  }
  topo.appendChild(prazo);

  const pendentes = dia.pedidos.filter(function(p) { return p.status === 'ENVIADO'; });
  const ativos = dia.pedidos.filter(pedidoAtivo);
  const acoes = el('div', 'cardapio-acoes');

  if (pendentes.length) {
    acoes.appendChild(criarBotao('Confirmar todos (' + pendentes.length + ')', {
      classe: 'botao-primario', icone: 'check',
      aoClicar: function(evento) { confirmarTodosPedidos(dia, evento.currentTarget); }
    }));
  }

  if (dia.data >= hojeTexto()) {
    acoes.appendChild(criarBotao('Pedido de cliente', {
      classe: 'botao-secundario', icone: 'cliente',
      titulo: 'Registrar o pedido de um cliente que não tem cadastro',
      aoClicar: function() { abrirPedidoCliente(dia); }
    }));
  }

  if (ativos.length) {
    acoes.appendChild(criarBotao('Imprimir', {
      classe: 'botao-secundario', icone: 'imprimir',
      titulo: 'Imprimir os pedidos para a cozinha',
      aoClicar: function() { abrirImpressao(dia); }
    }));
  }

  acoes.appendChild(criarBotaoSom());
  topo.appendChild(acoes);

  conteudo.innerHTML = '';

  // Pedidos de prazo extra das empresas
  if (dia.prazos_extras && dia.prazos_extras.length) conteudo.appendChild(criarPainelPrazosExtras(dia));

  // Indicadores
  const indicadores = el('div', 'grade-indicadores');
  indicadores.appendChild(criarIndicador({
    icone: 'pedido',
    rotulo: 'Quentinhas',
    valor: dia.producao.total,
    detalhe: dia.producao.confirmadas + ' confirmada(s)' +
      (dia.producao.avulsas ? ' · ' + dia.producao.avulsas + ' avulsa(s)' : '') +
      (dia.producao.clientes ? ' · ' + dia.producao.clientes + ' de clientes' : '')
  }));
  indicadores.appendChild(criarIndicador({
    icone: 'empresa',
    cor: 'azul',
    rotulo: 'Pedidos',
    valor: dia.pedidos.filter(function(p) { return p.status !== 'CANCELADO'; }).length,
    detalhe: pendentes.length ? pendentes.length + ' aguardando confirmação' : 'nenhum pendente'
  }));
  indicadores.appendChild(criarIndicador({
    icone: 'alerta',
    cor: dia.sem_pedido.length ? 'amarelo' : '',
    rotulo: 'Empresas sem pedido',
    valor: dia.sem_pedido.length,
    detalhe: dia.sem_pedido.slice(0, 2).join(', ') + (dia.sem_pedido.length > 2 ? '…' : '')
  }));
  conteudo.appendChild(indicadores);

  const grade = el('div', 'grade-paineis');

  // Pedidos das empresas
  const colunaPedidos = el('div');
  colunaPedidos.appendChild(el('h3', 'titulo-secao', 'Pedidos das empresas'));

  if (!dia.pedidos.length) {
    colunaPedidos.appendChild(estadoVazio({
      icone: 'pedido',
      titulo: 'Nenhum pedido',
      texto: dia.cardapio
        ? 'Nenhuma empresa enviou pedido para este dia.'
        : 'Não há cardápio publicado para este dia.'
    }));
  }

  dia.pedidos.forEach(function(pedido) { colunaPedidos.appendChild(criarCartaoPedido(pedido, dia)); });
  grade.appendChild(colunaPedidos);

  // Produção
  grade.appendChild(criarCartaoProducao(dia));
  conteudo.appendChild(grade);
}

// ---------- PRAZO EXTRA (restaurante) ----------
function criarPainelPrazosExtras(dia) {
  const minutos = dia.minutos_prazo_extra || 30;
  const pendentes = dia.prazos_extras.filter(function(s) { return s.status === 'PENDENTE'; });
  const respondidos = dia.prazos_extras.filter(function(s) { return s.status !== 'PENDENTE'; });
  const caixa = el('div', 'painel-prazos-extras');

  pendentes.forEach(function(s) {
    const cartao = el('div', 'cartao prazo-extra-pedido');
    const textos = el('div', 'prazo-extra-textos');
    textos.appendChild(el('strong', '', s.nome + ' pediu mais ' + minutos + ' minutos'));
    textos.appendChild(el('span', '', 'Às ' + horaDe(s.solicitado_em) + ' · o horário de pedidos já tinha acabado'));
    if (s.mensagem) textos.appendChild(el('q', 'prazo-extra-mensagem', s.mensagem));
    cartao.appendChild(textos);

    const acoes = el('div', 'prazo-extra-acoes');
    const liberar = criarBotao('Liberar ' + minutos + ' min', {
      classe: 'botao-primario', icone: 'check',
      aoClicar: function() { responderPrazo(s, true, '', liberar); }
    });
    const recusar = criarBotao('Recusar', {
      classe: 'botao-secundario',
      aoClicar: function() { recusarPrazo(s); }
    });
    acoes.appendChild(liberar);
    acoes.appendChild(recusar);
    cartao.appendChild(acoes);
    caixa.appendChild(cartao);
  });

  if (respondidos.length) {
    const lista = el('div', 'prazo-extra-historico');
    respondidos.forEach(function(s) {
      const texto = s.status === 'LIBERADO'
        ? s.nome + ': prazo extra até ' + s.liberado_ate_texto
        : s.status === 'ENCERRADO'
          ? s.nome + ': prazo extra terminou às ' + s.liberado_ate_texto
          : s.nome + ': pedido de prazo recusado' + (s.resposta ? ' (' + s.resposta + ')' : '');
      lista.appendChild(el('span', 'prazo-extra-item ' + s.status.toLowerCase(), texto));
    });
    caixa.appendChild(lista);
  }

  return caixa;
}

function responderPrazo(solicitacao, liberar, resposta, botao) {
  const tarefa = apiSessao('responderPrazoExtra', solicitacao.solicitacao_id, liberar, resposta || '');
  (botao ? comCarregamento(botao, tarefa) : tarefa)
    .then(function(r) {
      aplicarDiaAtualizado(r.dia);
      avisar(r.mensagem);
    })
    .catch(function(erro) { avisar(erro.message, 'erro'); });
}

function recusarPrazo(solicitacao) {
  const form = el('form');
  form.noValidate = true;
  form.appendChild(el('p', 'texto-apoio', solicitacao.nome + ' não poderá pedir nem alterar o pedido de hoje.'));
  const bloco = el('div', 'campo');
  bloco.appendChild(el('label', '', 'Motivo (a empresa vê)'));
  const campo = el('input');
  campo.maxLength = 200;
  campo.placeholder = 'Opcional. Ex.: a produção já foi fechada';
  bloco.appendChild(campo);
  form.appendChild(bloco);

  const rodape = el('div', 'modal-rodape');
  rodape.appendChild(criarBotao('Voltar', { classe: 'botao-secundario', aoClicar: fecharModal }));
  const enviar = criarBotao('Recusar', { classe: 'botao-perigo' });
  enviar.type = 'submit';
  rodape.appendChild(enviar);
  form.appendChild(rodape);

  form.addEventListener('submit', function(evento) {
    evento.preventDefault();
    comCarregamento(enviar, apiSessao('responderPrazoExtra', solicitacao.solicitacao_id, false, campo.value))
      .then(function(r) {
        fecharModal();
        aplicarDiaAtualizado(r.dia);
        avisar(r.mensagem);
      })
      .catch(function(erro) { avisar(erro.message, 'erro'); });
  });

  abrirModal('Recusar mais prazo', form, { pequeno: true });
  setTimeout(function() { campo.focus(); }, 50);
}

function pedidoAtivo(pedido) {
  return pedido.status === 'ENVIADO' || pedido.status === 'CONFIRMADO';
}

function criarCartaoPedido(pedido, dia) {
  const cliente = pedido.cliente_avulso;
  const cartao = el('div', 'cartao cartao-pedido' + (pedido.status === 'ENVIADO' ? ' pendente' : '') + (cliente ? ' cliente' : ''));
  cartao.dataset.pedido = pedido.pedido_id;

  const topo = el('div', 'cartao-pedido-topo');
  const textos = el('div');
  textos.appendChild(el('strong', '', pedido.nome_empresa));

  let detalhe;

  if (pedido.status === 'CANCELADO') {
    detalhe = (cliente ? 'Cancelado às ' : 'Cancelado pela empresa às ') + horaDe(pedido.atualizado_em);
  } else {
    detalhe = pedido.quantidade_total + ' quentinha(s) · ' + formatarMoeda(pedido.valor_total) +
      (cliente ? ' · registrado às ' : ' · enviado às ') + horaDe(pedido.atualizado_em || pedido.criado_em);
  }

  if (cliente) {
    detalhe = 'Cliente sem cadastro' + (pedido.cliente_telefone ? ' · ' + pedido.cliente_telefone : '') + ' · ' + detalhe;
  }

  textos.appendChild(el('span', '', detalhe));
  topo.appendChild(textos);
  topo.appendChild(cliente && pedido.status === 'CONFIRMADO' ? criarEtiqueta('Cliente', 'azul') : etiquetaPedido(pedido.status));
  cartao.appendChild(topo);

  if (pedido.alterado_apos_confirmacao) {
    cartao.appendChild(criarAlerta('A empresa alterou este pedido depois da sua confirmação.', { tipo: 'info', icone: 'editar' }));
  }

  if (pedido.status === 'RECUSADO' && pedido.resposta_restaurante) {
    cartao.appendChild(el('div', 'dia-observacao', 'Motivo da recusa: ' + pedido.resposta_restaurante));
  }

  if (pedido.observacoes) {
    cartao.appendChild(el('div', 'dia-observacao', (cliente ? 'Observação: ' : 'Observação da empresa: ') + pedido.observacoes));
  }

  if (pedido.status === 'CANCELADO') {
    // Só o proprietário apaga, e só pedidos cancelados
    if (estado.usuario.proprietario) {
      const acoesCancelado = el('div', 'cartao-pedido-acoes');
      acoesCancelado.appendChild(criarBotao('Apagar', {
        classe: 'botao-fantasma botao-pequeno botao-texto-perigo', icone: 'lixeira',
        titulo: 'Apagar este pedido cancelado de vez',
        aoClicar: function(evento) { apagarPedidoCancelado(pedido, evento.currentTarget); }
      }));
      cartao.appendChild(acoesCancelado);
    }
    return cartao;
  }

  // Resumo por proteína dentro do pedido
  const contagem = {};
  pedido.itens.forEach(function(item) { contagem[item.proteina] = (contagem[item.proteina] || 0) + 1; });
  const resumo = el('div', 'chips');
  Object.keys(contagem).forEach(function(p) {
    resumo.appendChild(el('span', 'chip destaque sem-botao', contagem[p] + '× ' + p));
  });
  cartao.appendChild(resumo);

  const acoes = el('div', 'cartao-pedido-acoes');
  acoes.appendChild(criarBotao('Ver itens', {
    classe: 'botao-secundario botao-pequeno', icone: 'pedido',
    aoClicar: function() { mostrarItensPedido(pedido); }
  }));

  acoes.appendChild(criarBotao('Imprimir', {
    classe: 'botao-secundario botao-pequeno', icone: 'imprimir',
    aoClicar: function() { imprimirPedidos(dia, [pedido], { resumo: false, separar: false }); }
  }));

  if (cliente) {
    if (dia.data >= hojeTexto()) {
      acoes.appendChild(criarBotao('Editar', {
        classe: 'botao-secundario botao-pequeno', icone: 'editar',
        aoClicar: function() { abrirPedidoCliente(dia, pedido); }
      }));
    }

    acoes.appendChild(criarBotao('Cancelar', {
      classe: 'botao-fantasma botao-pequeno botao-texto-perigo',
      aoClicar: function(evento) { cancelarPedidoDeCliente(pedido, evento.currentTarget); }
    }));

    cartao.appendChild(acoes);
    return cartao;
  }

  if (pedido.status === 'ENVIADO') {
    acoes.appendChild(criarBotao('Confirmar', {
      classe: 'botao-primario botao-pequeno', icone: 'check',
      aoClicar: function(evento) { confirmarUmPedido(pedido, evento.currentTarget); }
    }));
  }

  if (pedido.cobrado) {
    acoes.appendChild(el('span', 'nota-cobrado', 'Já entrou numa cobrança'));
  } else if (pedido.status === 'ENVIADO' || pedido.status === 'CONFIRMADO') {
    acoes.appendChild(criarBotao('Recusar', {
      classe: 'botao-fantasma botao-pequeno botao-texto-perigo',
      aoClicar: function() { recusarUmPedido(pedido); }
    }));
  }

  cartao.appendChild(acoes);
  return cartao;
}

function criarCartaoProducao(dia) {
  const cartao = el('div', 'cartao');
  cartao.appendChild(el('h2', '', 'Produção do dia'));
  cartao.appendChild(el('p', 'subtitulo-cartao', 'Pedidos enviados e confirmados.'));

  const proteinas = Object.keys(dia.producao.por_proteina);

  if (!proteinas.length) {
    cartao.appendChild(el('div', 'contador', 'Nenhuma quentinha ainda.'));
    return cartao;
  }

  const tabela = el('div', 'tabela-producao');
  proteinas
    .sort(function(a, b) { return dia.producao.por_proteina[b] - dia.producao.por_proteina[a]; })
    .forEach(function(p) {
      const linha = el('div', 'linha-producao');
      linha.appendChild(el('span', '', p));
      linha.appendChild(el('strong', '', String(dia.producao.por_proteina[p])));
      tabela.appendChild(linha);
    });

  Object.keys(dia.producao.extras).forEach(function(extra) {
    const linha = el('div', 'linha-producao extra');
    linha.appendChild(el('span', '', extra + ' (extra)'));
    linha.appendChild(el('strong', '', String(dia.producao.extras[extra])));
    tabela.appendChild(linha);
  });

  const total = el('div', 'linha-producao total');
  total.appendChild(el('span', '', 'Total de quentinhas'));
  total.appendChild(el('strong', '', String(dia.producao.total)));
  tabela.appendChild(total);
  cartao.appendChild(tabela);

  if (dia.producao.personalizadas.length) {
    cartao.appendChild(el('div', 'grupo-titulo espaco-acima', 'Personalizadas (' + dia.producao.personalizadas.length + ')'));
    const lista = el('div', 'lista-personalizadas');

    dia.producao.personalizadas.forEach(function(p) {
      const item = el('div', 'item-personalizado');
      item.appendChild(el('strong', '', p.nome + (p.nome !== p.nome_empresa ? ' · ' + p.nome_empresa : '')));
      const partes = [p.proteina];
      if (p.itens_removidos.length) partes.push('sem ' + p.itens_removidos.join(', ').toLowerCase());
      if (p.observacao) partes.push('obs.: ' + p.observacao);
      item.appendChild(el('span', '', partes.join(' · ')));
      lista.appendChild(item);
    });

    cartao.appendChild(lista);
  }

  return cartao;
}

function mostrarItensPedido(pedido) {
  const caixa = el('div');

  caixa.appendChild(el('p', 'texto-apoio', pedido.quantidade_total + ' quentinha(s) · ' +
    formatarMoeda(pedido.valor_total) + ' · ' + (SITUACOES_PEDIDO[pedido.status] || {}).texto));

  const lista = el('div', 'lista-itens-pedido');

  pedido.itens.forEach(function(item) {
    const linha = el('div', 'item-pedido');
    const nome = el('div', 'item-pedido-nome');
    nome.appendChild(el('strong', '', item.nome));
    if (item.avulsa && !pedido.cliente_avulso) nome.appendChild(criarEtiqueta('Avulsa', 'cinza'));
    linha.appendChild(nome);

    const partes = [item.proteina];
    if (item.opcao_extra) partes.push('+ ' + item.opcao_extra);
    if (item.itens_removidos.length) partes.push('sem ' + item.itens_removidos.join(', ').toLowerCase());
    if (item.observacao) partes.push('obs.: ' + item.observacao);
    linha.appendChild(el('span', '', partes.join(' · ')));

    lista.appendChild(linha);
  });

  caixa.appendChild(lista);

  const rodape = el('div', 'modal-rodape');
  rodape.appendChild(criarBotao('Fechar', { classe: 'botao-secundario', aoClicar: fecharModal }));
  caixa.appendChild(rodape);

  abrirModal('Pedido de ' + pedido.nome_empresa, caixa);
}

}

function confirmarTodosPedidos(dia, botao) {

  confirmar({
    titulo: 'Confirmar ' + pendentes.length + ' pedido(s)?',
