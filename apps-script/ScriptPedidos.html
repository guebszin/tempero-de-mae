// ================================================================
// RESTAURANTE: PEDIDO DE CLIENTE SEM CADASTRO
// O pedido já entra confirmado e vai direto para a produção do dia.
// ================================================================
// O campo de valor usa a máscara de caixa registradora (os dígitos são
// centavos): "20,00" e "2,000" (ainda sendo formatado) valem R$ 20,00
function textoParaValor(texto) {
  const digitos = String(texto || '').replace(/\D/g, '');
  return digitos ? Number(digitos) / 100 : 0;
}

function valorParaCampo(valor) {
  if (!valor) return '';
  return aplicarMascara(String(Math.round(Number(valor) * 100)), 'moeda');
}

function abrirPedidoCliente(dia, pedido) {
  if (!dia.cardapio || !dia.cardapio.proteinas.length) {
    avisar('Publique o cardápio de ' + formatarData(dia.data) + ' antes de registrar pedidos.', 'erro');
    return;
  }

  const proteinas = dia.cardapio.proteinas;
  const extras = dia.opcoes_extra || [];
  const form = el('form', 'form-pedido-cliente');
  form.noValidate = true;

  const erro = el('div', 'mensagem-erro');
  erro.hidden = true;
  form.appendChild(erro);

  form.appendChild(el('p', 'texto-apoio', 'Para quem não tem cadastro. O pedido já entra confirmado na produção de ' +
    nomeDoDiaCompleto(dia.data).toLowerCase() + '.'));

  function criarCampo(rotulo, campo, classe) {
    const caixa = el('div', 'campo' + (classe ? ' ' + classe : ''));
    caixa.appendChild(el('label', '', rotulo));
    caixa.appendChild(campo);
    return caixa;
  }

  const grade = el('div', 'grade-2');

  const nome = el('input');
  nome.maxLength = 80;
  nome.placeholder = 'Ex.: Marcos (oficina da esquina)';
  nome.value = pedido ? pedido.nome_empresa : '';
  grade.appendChild(criarCampo('Nome do cliente', nome, 'inteiro'));

  const telefone = el('input');
  telefone.type = 'tel';
  telefone.dataset.mascara = 'telefone';
  telefone.placeholder = '(00) 00000-0000';
  telefone.value = pedido ? pedido.cliente_telefone : '';
  const campoTelefone = criarCampo('Telefone ', telefone);
  campoTelefone.querySelector('label').appendChild(el('span', 'secundario', '(opcional)'));
  grade.appendChild(campoTelefone);

  const valor = el('input');
  valor.inputMode = 'numeric';
  valor.dataset.mascara = 'moeda';
  valor.placeholder = 'R$ 0,00';
  valor.value = valorParaCampo(pedido && pedido.quantidade_total
    ? pedido.valor_total / pedido.quantidade_total
    : dia.preco_cliente_avulso);
  grade.appendChild(criarCampo('Valor de cada quentinha', valor));

  form.appendChild(grade);

  form.appendChild(el('div', 'grupo-titulo', 'Quentinhas'));
  const linhas = el('div', 'linhas-cliente');
  form.appendChild(linhas);

  function criarSeletor(opcoes, valorAtual) {
    const seletor = el('select');
    opcoes.forEach(function(opcao) {
      const item = el('option', '', opcao.texto);
      item.value = opcao.valor;
      seletor.appendChild(item);
    });
    seletor.value = valorAtual || opcoes[0].valor;
    return seletor;
  }

  function adicionarLinha(dados) {
    dados = dados || {};
    const linha = el('div', 'linha-cliente');

    const proteina = criarSeletor(
      (proteinas.length > 1 ? [{ valor: '', texto: 'Proteína…' }] : []).concat(
        proteinas.map(function(p) { return { valor: p, texto: p }; })
      ),
      dados.proteina
    );
    proteina.dataset.campo = 'proteina';
    linha.appendChild(proteina);

    if (extras.length) {
      const extra = criarSeletor(
        [{ valor: '', texto: 'Sem extra' }].concat(extras.map(function(e) { return { valor: e, texto: e }; })),
        dados.opcao_extra
      );
      extra.dataset.campo = 'opcao_extra';
      linha.appendChild(extra);
    }

    const contador = el('div', 'contador-quantidade');
    const menos = el('button', 'botao-icone pequeno', '−');
    menos.type = 'button';
    menos.title = 'Diminuir';
    const quantidade = el('input');
    quantidade.inputMode = 'numeric';
    quantidade.dataset.campo = 'quantidade';
    quantidade.value = String(dados.quantidade || 1);
    quantidade.setAttribute('aria-label', 'Quantidade');
    const mais = el('button', 'botao-icone pequeno', '+');
    mais.type = 'button';
    mais.title = 'Aumentar';

    menos.addEventListener('click', function() {
      quantidade.value = String(Math.max(1, (parseInt(quantidade.value, 10) || 1) - 1));
      atualizarTotal();
    });
    mais.addEventListener('click', function() {
      quantidade.value = String(Math.min(300, (parseInt(quantidade.value, 10) || 0) + 1));
      atualizarTotal();
    });
    quantidade.addEventListener('input', function() {
      quantidade.value = quantidade.value.replace(/\D/g, '').slice(0, 3);
      atualizarTotal();
    });

    contador.appendChild(menos);
    contador.appendChild(quantidade);
    contador.appendChild(mais);
    linha.appendChild(contador);

    const remover = el('button', 'botao-icone pequeno remover-linha');
    remover.type = 'button';
    remover.title = 'Remover linha';
    remover.innerHTML = icone('lixeira');
    remover.addEventListener('click', function() {
      if (linhas.children.length === 1) {
        avisar('O pedido precisa de pelo menos uma linha.', 'erro');
        return;
      }
      linha.remove();
      atualizarTotal();
    });
    linha.appendChild(remover);

    const observacao = el('input', 'campo-item observacao');
    observacao.maxLength = 200;
    observacao.placeholder = 'Observação (opcional). Ex.: sem feijão';
    observacao.dataset.campo = 'observacao';
    observacao.value = dados.observacao || '';
    linha.appendChild(observacao);

    linhas.appendChild(linha);
    atualizarTotal();
    return linha;
  }

  const adicionar = criarBotao('Adicionar outra proteína', {
    classe: 'botao-fantasma botao-pequeno', icone: 'adicionar',
    aoClicar: function() {
      const linha = adicionarLinha();
      linha.querySelector('select').focus();
    }
  });
  form.appendChild(adicionar);

  const observacoes = el('textarea');
  observacoes.maxLength = 300;
  observacoes.placeholder = 'Ex.: retira no balcão às 11h30';
  observacoes.value = pedido ? pedido.observacoes : '';
  const campoObservacoes = criarCampo('Observação do pedido ', observacoes, 'espaco-acima');
  campoObservacoes.querySelector('label').appendChild(el('span', 'secundario', '(opcional)'));
  form.appendChild(campoObservacoes);

  const total = el('div', 'total-cliente');
  form.appendChild(total);

  function lerLinhas() {
    return Array.prototype.map.call(linhas.children, function(linha) {
      const dados = {};
      linha.querySelectorAll('[data-campo]').forEach(function(campo) { dados[campo.dataset.campo] = campo.value.trim(); });
      dados.quantidade = parseInt(dados.quantidade, 10) || 0;
      return dados;
    });
  }

  function atualizarTotal() {
    const quantidade = lerLinhas().reduce(function(soma, l) { return soma + l.quantidade; }, 0);
    total.innerHTML = '';
    total.appendChild(el('strong', '', quantidade + (quantidade === 1 ? ' quentinha' : ' quentinhas')));
    total.appendChild(el('span', '', formatarMoeda(quantidade * textoParaValor(valor.value))));
  }

  // Depois da máscara formatar o número (ela roda logo após este evento)
  valor.addEventListener('input', function() { setTimeout(atualizarTotal, 0); });

  // Linhas iniciais: as do pedido (agrupadas) ou uma em branco
  if (pedido && pedido.itens.length) {
    const grupos = [];
    pedido.itens.forEach(function(item) {
      const existente = grupos.find(function(g) {
        return g.proteina === item.proteina && g.opcao_extra === item.opcao_extra && g.observacao === item.observacao;
      });
      if (existente) existente.quantidade++;
      else grupos.push({ proteina: item.proteina, opcao_extra: item.opcao_extra, observacao: item.observacao, quantidade: 1 });
    });
    grupos.forEach(adicionarLinha);
  } else {
    adicionarLinha();
  }

  const rodape = el('div', 'modal-rodape');
  rodape.appendChild(criarBotao('Cancelar', { classe: 'botao-secundario', aoClicar: fecharModal }));
  const salvar = criarBotao(pedido ? 'Salvar alterações' : 'Registrar pedido', { classe: 'botao-primario', icone: 'check' });
  salvar.type = 'submit';
  rodape.appendChild(salvar);
  form.appendChild(rodape);

  form.addEventListener('submit', function(evento) {
    evento.preventDefault();
    erro.hidden = true;

    function mostrarErro(texto) {
      erro.textContent = texto;
      erro.hidden = false;
      erro.scrollIntoView({ block: 'nearest' });
    }

    const itens = lerLinhas();

    if (nome.value.trim().length < 2) return mostrarErro('Informe o nome do cliente.');
    if (!textoParaValor(valor.value)) return mostrarErro('Informe o valor de cada quentinha.');
    if (itens.some(function(l) { return !l.proteina; })) return mostrarErro('Escolha a proteína de cada linha.');
    if (itens.some(function(l) { return l.quantidade < 1; })) return mostrarErro('Informe a quantidade de cada linha.');

    const dados = {
      pedido_id: pedido ? pedido.pedido_id : '',
      data: dia.data,
      cliente_nome: nome.value,
      cliente_telefone: telefone.value,
      valor_unitario: valor.value,
      observacoes: observacoes.value,
      itens: itens
    };

    comCarregamento(salvar, apiSessao('salvarPedidoCliente', dados))
      .then(function(resposta) {
        fecharModal();
        aplicarDiaAtualizado(resposta.dia_anterior);
        aplicarDiaAtualizado(resposta.dia);
        avisar(resposta.mensagem);
      })
      .catch(function(falha) { mostrarErro(falha.message); });
  });

  abrirModal(pedido ? 'Pedido de ' + pedido.nome_empresa : 'Pedido de cliente sem cadastro', form);
}

function cancelarPedidoDeCliente(pedido, botao) {
  confirmar({
    titulo: 'Cancelar o pedido de ' + pedido.nome_empresa + '?',
    mensagem: 'As ' + pedido.quantidade_total + ' quentinha(s) saem da produção do dia.',
    textoBotao: 'Cancelar pedido',
    textoCancelar: 'Voltar',
    perigo: true
  }).then(function(sim) {
    if (!sim) return;

    comCarregamento(botao, apiSessao('cancelarPedidoCliente', pedido.pedido_id))
      .then(function(resposta) {
        aplicarDiaAtualizado(resposta.dia);
        avisar(resposta.mensagem);
      })
      .catch(function(erro) { avisar(erro.message, 'erro'); });
  });
}

function apagarPedidoCancelado(pedido, botao) {
  confirmar({
    titulo: 'Apagar pedido cancelado',
    mensagem: 'Apagar de vez o pedido cancelado de ' + pedido.nome_empresa + '? Ele some da lista e do histórico. ' +
      'Esta ação não pode ser desfeita.',
    textoBotao: 'Apagar',
    perigo: true
  }).then(function(sim) {
    if (!sim) return;

    comCarregamento(botao, apiSessao('excluirPedidoCancelado', pedido.pedido_id))
      .then(function(resposta) {
        aplicarDiaAtualizado(resposta.dia);
        avisar(resposta.mensagem, 'sucesso');
      })
      .catch(function(erro) { avisar(erro.message, 'erro'); });
  });
}

// ================================================================
// RESTAURANTE: IMPRIMIR PARA A COZINHA
// Monta uma página só para o papel (área #areaImpressao) e abre a
// janela de impressão do navegador. Também dá para "Salvar como PDF".
// ================================================================
function abrirImpressao(dia) {
  const ativos = dia.pedidos.filter(pedidoAtivo);

  if (!ativos.length) {
    avisar('Não há pedidos para imprimir neste dia.', 'erro');
    return;
  }

  const form = el('form');
  form.noValidate = true;
  form.appendChild(el('p', 'texto-apoio', 'Escolha o que imprimir. Pedidos cancelados ou recusados não entram.'));

  const lista = el('div', 'lista-impressao');
  const marcadores = [];

  ativos.forEach(function(pedido) {
    const rotulo = el('label', 'opcao-impressao');
    const marcar = el('input');
    marcar.type = 'checkbox';
    marcar.checked = true;
    marcadores.push({ marcar: marcar, pedido: pedido });
    rotulo.appendChild(marcar);

    const textos = el('div');
    textos.appendChild(el('strong', '', pedido.nome_empresa));
    textos.appendChild(el('span', '', pedido.quantidade_total + ' quentinha(s)' +
      (pedido.status === 'ENVIADO' ? ' · aguardando confirmação' : '') +
      (pedido.cliente_avulso ? ' · cliente sem cadastro' : '')));
    rotulo.appendChild(textos);
    lista.appendChild(rotulo);
  });

  const todos = criarBotao('Desmarcar todos', {
    classe: 'botao-fantasma botao-pequeno',
    aoClicar: function() {
      const marcarTodos = marcadores.every(function(m) { return !m.marcar.checked; });
      marcadores.forEach(function(m) { m.marcar.checked = marcarTodos; });
      todos.textContent = marcarTodos ? 'Desmarcar todos' : 'Marcar todos';
    }
  });

  form.appendChild(todos);
  form.appendChild(lista);

  function criarOpcao(texto, detalhe, marcado) {
    const rotulo = el('label', 'opcao-checkbox');
    const marcar = el('input');
    marcar.type = 'checkbox';
    marcar.checked = marcado;
    rotulo.appendChild(marcar);
    const textos = el('div');
    textos.appendChild(el('strong', '', texto));
    textos.appendChild(el('span', '', detalhe));
    rotulo.appendChild(textos);
    form.appendChild(rotulo);
    return marcar;
  }

  const resumo = criarOpcao('Resumo da produção', 'Uma tabela com as quantidades de cada proteína por empresa.', ativos.length > 1);
  const separar = criarOpcao('Cada pedido em uma folha', 'Facilita entregar cada empresa para uma pessoa da cozinha.', true);

  const rodape = el('div', 'modal-rodape');
  rodape.appendChild(criarBotao('Cancelar', { classe: 'botao-secundario', aoClicar: fecharModal }));
  const imprimir = criarBotao('Imprimir', { classe: 'botao-primario', icone: 'imprimir' });
  imprimir.type = 'submit';
  rodape.appendChild(imprimir);
  form.appendChild(rodape);

  form.addEventListener('submit', function(evento) {
    evento.preventDefault();

    const escolhidos = marcadores.filter(function(m) { return m.marcar.checked; }).map(function(m) { return m.pedido; });

    if (!escolhidos.length && !resumo.checked) {
      avisar('Marque pelo menos um pedido.', 'erro');
      return;
    }

    fecharModal();
    imprimirPedidos(dia, escolhidos, { resumo: resumo.checked, separar: separar.checked });
  });

  abrirModal('Imprimir pedidos', form, { pequeno: true });
}

// Ordem das proteínas: a mesma do cardápio
function ordemProteinas(dia) {
  const ordem = (dia.cardapio && dia.cardapio.proteinas.slice()) || [];
  dia.pedidos.forEach(function(p) {
    p.itens.forEach(function(item) {
      if (ordem.indexOf(item.proteina) === -1) ordem.push(item.proteina);
    });
  });
  return ordem;
}

// Quentinha com alguma mudança: itens retirados ou observação
function itemAlterado(item) {
  return !!(item.itens_removidos.length || item.observacao);
}

function criarTabelaImpressao(itens, proteinas, alteradas) {
  const tabela = el('table', 'imp-tabela' + (alteradas ? ' imp-tabela-alteradas' : ''));
  const cabeca = el('tr');
  ['', 'Nome', 'Proteína', 'Extra', alteradas ? 'Alteração' : 'Observações'].forEach(function(titulo, i) {
    cabeca.appendChild(el('th', i === 0 ? 'marcar' : '', titulo));
  });
  tabela.appendChild(el('thead')).appendChild(cabeca);

  const corpo = el('tbody');
  itens
    .slice()
    .sort(function(a, b) {
      return (proteinas.indexOf(a.proteina) - proteinas.indexOf(b.proteina)) ||
        a.nome.localeCompare(b.nome, 'pt-BR');
    })
    .forEach(function(item) {
      const linha = el('tr');
      linha.appendChild(el('td', 'marcar', '☐'));
      linha.appendChild(el('td', '', item.nome));
      linha.appendChild(el('td', '', item.proteina));
      linha.appendChild(el('td', '', item.opcao_extra || '–'));

      const notas = [];
      if (item.itens_removidos.length) notas.push('SEM ' + item.itens_removidos.join(', ').toUpperCase());
      if (item.observacao) notas.push(item.observacao);
      linha.appendChild(el('td', alteradas ? 'imp-nota-alteracao' : '', notas.join(' · ')));
      corpo.appendChild(linha);
    });

  tabela.appendChild(corpo);
  return tabela;
}

function imprimirPedidos(dia, pedidos, opcoes) {
  const area = $('areaImpressao');
  area.innerHTML = '';

  const proteinas = ordemProteinas(dia);
  const totalGeral = pedidos.reduce(function(soma, p) { return soma + p.itens.length; }, 0);
  const agora = new Date();

  const cabecalho = el('div', 'imp-cabecalho');
  cabecalho.appendChild(el('strong', '', 'Tempero de Mãe · Pedidos de ' + nomeDoDiaCompleto(dia.data).toLowerCase() + '/' + dia.data.slice(0, 4)));
  cabecalho.appendChild(el('span', '', 'Impresso às ' + horaDe(agora.getTime()) + ' · ' +
    totalGeral + (totalGeral === 1 ? ' quentinha' : ' quentinhas')));
  area.appendChild(cabecalho);

  let primeiraSecao = true;

  function novaSecao(classe) {
    const secao = el('section', classe + (!primeiraSecao && opcoes.separar ? ' imp-nova-folha' : ''));
    primeiraSecao = false;
    area.appendChild(secao);
    return secao;
  }

  // ---------- RESUMO ----------
  if (opcoes.resumo && pedidos.length) {
    const secao = novaSecao('imp-resumo');
    secao.appendChild(el('h2', '', 'Resumo da produção'));

    if (dia.cardapio) {
      const acompanha = dia.cardapio.acompanhamentos.concat(dia.cardapio.saladas, dia.cardapio.guarnicoes);
      if (acompanha.length) secao.appendChild(el('p', 'imp-detalhe', 'Acompanha: ' + acompanha.join(', ')));
    }

    const tabela = el('table', 'imp-tabela imp-tabela-resumo');
    const cabeca = el('tr');
    cabeca.appendChild(el('th', '', 'Pedido'));
    proteinas.forEach(function(p) { cabeca.appendChild(el('th', 'num', p)); });
    cabeca.appendChild(el('th', 'num', 'Com alteração'));
    cabeca.appendChild(el('th', 'num', 'Total'));
    tabela.appendChild(el('thead')).appendChild(cabeca);

    const corpo = el('tbody');
    const somas = {};
    const extras = {};
    let somaAlteradas = 0;

    pedidos.forEach(function(pedido) {
      const linha = el('tr');
      linha.appendChild(el('td', '', pedido.nome_empresa + (pedido.status === 'ENVIADO' ? ' *' : '')));
      proteinas.forEach(function(p) {
        const quantidade = pedido.itens.filter(function(i) { return i.proteina === p; }).length;
        somas[p] = (somas[p] || 0) + quantidade;
        linha.appendChild(el('td', 'num', quantidade ? String(quantidade) : '–'));
      });
      const alteradasPedido = pedido.itens.filter(itemAlterado).length;
      somaAlteradas += alteradasPedido;
      linha.appendChild(el('td', 'num', alteradasPedido ? String(alteradasPedido) : '–'));
      linha.appendChild(el('td', 'num forte', String(pedido.itens.length)));
      corpo.appendChild(linha);

      pedido.itens.forEach(function(i) {
        if (i.opcao_extra) extras[i.opcao_extra] = (extras[i.opcao_extra] || 0) + 1;
      });
    });

    const linhaTotal = el('tr', 'imp-total');
    linhaTotal.appendChild(el('td', '', 'Total'));
    proteinas.forEach(function(p) { linhaTotal.appendChild(el('td', 'num', String(somas[p] || 0))); });
    linhaTotal.appendChild(el('td', 'num', String(somaAlteradas)));
    linhaTotal.appendChild(el('td', 'num', String(totalGeral)));
    corpo.appendChild(linhaTotal);
    tabela.appendChild(corpo);
    secao.appendChild(tabela);

    const textoExtras = Object.keys(extras).map(function(e) { return e + ': ' + extras[e]; });
    if (textoExtras.length) secao.appendChild(el('p', 'imp-detalhe', 'Extras — ' + textoExtras.join(' · ')));

    if (pedidos.some(function(p) { return p.status === 'ENVIADO'; })) {
      secao.appendChild(el('p', 'imp-nota', '* Pedido ainda aguardando confirmação.'));
    }
  }

  // ---------- UM BLOCO POR PEDIDO ----------
  pedidos.forEach(function(pedido) {
    const secao = novaSecao('imp-pedido');

    const topo = el('div', 'imp-pedido-topo');
    const textos = el('div');
    textos.appendChild(el('h2', '', pedido.nome_empresa));

    const detalhes = [];
    if (pedido.cliente_avulso) detalhes.push('Cliente sem cadastro' + (pedido.cliente_telefone ? ' · ' + pedido.cliente_telefone : ''));
    detalhes.push(formatarData(dia.data));
    detalhes.push(pedido.status === 'ENVIADO' ? 'AGUARDANDO CONFIRMAÇÃO' : 'Confirmado');
    textos.appendChild(el('p', 'imp-detalhe', detalhes.join(' · ')));
    topo.appendChild(textos);

    const quantidade = el('div', 'imp-quantidade');
    quantidade.appendChild(el('strong', '', String(pedido.itens.length)));
    quantidade.appendChild(el('span', '', pedido.itens.length === 1 ? 'quentinha' : 'quentinhas'));
    topo.appendChild(quantidade);
    secao.appendChild(topo);

    // Totais do pedido
    const contagem = [];
    proteinas.forEach(function(p) {
      const n = pedido.itens.filter(function(i) { return i.proteina === p; }).length;
      if (n) contagem.push(p + ': ' + n);
    });
    const extras = {};
    pedido.itens.forEach(function(i) { if (i.opcao_extra) extras[i.opcao_extra] = (extras[i.opcao_extra] || 0) + 1; });
    Object.keys(extras).forEach(function(e) { contagem.push(e + ': ' + extras[e]); });
    const totalAlteradas = pedido.itens.filter(itemAlterado).length;
    if (totalAlteradas) contagem.push('Com alteração: ' + totalAlteradas);
    secao.appendChild(el('p', 'imp-contagem', contagem.join('   ·   ')));

    if (pedido.observacoes) secao.appendChild(el('p', 'imp-observacao', 'Observação: ' + pedido.observacoes));

    // Lista das quentinhas: as normais primeiro; as que têm alguma
    // alteração (itens retirados ou observação) ficam separadas embaixo
    const alteradas = pedido.itens.filter(itemAlterado);
    const normais = pedido.itens.filter(function(item) { return !itemAlterado(item); });

    if (alteradas.length && normais.length) {
      secao.appendChild(el('h3', 'imp-subtitulo', 'Quentinhas normais (' + normais.length + ')'));
    }
    if (normais.length) secao.appendChild(criarTabelaImpressao(normais, proteinas, false));

    if (alteradas.length) {
      secao.appendChild(el('h3', 'imp-subtitulo imp-alteradas',
        '⚠ Com alteração (' + alteradas.length + ') — conferir antes de fechar'));
      secao.appendChild(criarTabelaImpressao(alteradas, proteinas, true));
    }
  });

  setTimeout(function() { window.print(); }, 60);
}

window.addEventListener('afterprint', function() {
  $('areaImpressao').innerHTML = '';
});

// ================================================================
// AO VIVO: pedidos aparecem sem precisar atualizar a página
// Restaurante: confere a cada 15 segundos (também com a aba em segundo
// plano, para tocar o aviso sonoro). Empresa: a cada 30 segundos.
// ================================================================
const aoVivo = {
  versao: null,
  pedidos: null,          // restaurante: { pedido_id: situação anterior }
  pedidoEmpresa: null,    // empresa: resumo anterior do pedido de hoje
  prazos: null,           // restaurante: pedidos de prazo extra já avisados
  temporizador: null,
  ocupado: false,
  ultimaVerificacao: 0,
  audio: null
};

AO_ENTRAR.push(function(dados, usuario) {
  if (usuario.perfil === 'admin' && dados.resumo && dados.resumo.pedidos) {
    atualizarPendencias(dados.resumo.pedidos.pendentes);
  }

  clearInterval(aoVivo.temporizador);
  aoVivo.versao = null;
  aoVivo.pedidos = null;
  aoVivo.pedidoEmpresa = null;
  aoVivo.temporizador = setInterval(verificarNovidades, usuario.perfil === 'admin' ? 15000 : 30000);
  setTimeout(verificarNovidades, 1500);
});

document.addEventListener('visibilitychange', function() {
  if (!document.hidden && Date.now() - aoVivo.ultimaVerificacao > 5000) verificarNovidades();
});

// O navegador só deixa tocar som depois de um clique na página
document.addEventListener('click', function() {
  if (aoVivo.audio) return;
  try {
    const Contexto = window.AudioContext || window.webkitAudioContext;
    if (Contexto) aoVivo.audio = new Contexto();
  } catch (erro) { /* sem som */ }
});

function verificarNovidades() {
  if (!estado.token || !estado.usuario || aoVivo.ocupado) return;
  if (document.hidden && estado.usuario.perfil !== 'admin') return;

  aoVivo.ocupado = true;
  aoVivo.ultimaVerificacao = Date.now();

  apiSessao('novidadesPedidos', aoVivo.versao)
    .then(function(resposta) {
      atualizarIndicadorAoVivo(true);
      if (resposta.recursos) aplicarRecursos(resposta.recursos);
      if (!resposta.mudou) return;

      const primeira = aoVivo.versao === null;
      aoVivo.versao = resposta.versao;

      if (estado.usuario.perfil === 'admin') {
        receberNovidadesRestaurante(resposta, primeira);
      } else {
        receberNovidadesEmpresa(resposta, primeira);
      }
    })
    .catch(function() { atualizarIndicadorAoVivo(false); })
    .finally(function() { aoVivo.ocupado = false; });
}

// ---------- RESTAURANTE ----------
function receberNovidadesRestaurante(resposta, primeira) {
  const anteriores = aoVivo.pedidos || {};
  const atuais = {};
  const avisos = [];

  resposta.pedidos.forEach(function(p) {
    atuais[p.pedido_id] = p;
    if (primeira || p.cliente_avulso) return;

    const antes = anteriores[p.pedido_id];
    const quentinhas = p.quantidade + (p.quantidade === 1 ? ' quentinha' : ' quentinhas');

    if (!antes) {
      if (p.status === 'ENVIADO') avisos.push('Novo pedido: ' + p.nome + ' (' + quentinhas + ')');
    } else if (p.status === 'CANCELADO' && antes.status !== 'CANCELADO') {
      avisos.push(p.nome + ' cancelou o pedido de hoje');
    } else if (p.status === 'ENVIADO' && p.atualizado_em !== antes.atualizado_em) {
      avisos.push(antes.status === 'CANCELADO'
        ? 'Novo pedido: ' + p.nome + ' (' + quentinhas + ')'
        : p.nome + ' alterou o pedido (' + quentinhas + ')');
    }
  });

  aoVivo.pedidos = atuais;

  // Pedidos de prazo extra novos
  const prazosAntes = aoVivo.prazos || {};
  const prazosAgora = {};
  (resposta.resumo.prazos_pendentes || []).forEach(function(s) {
    prazosAgora[s.solicitacao_id] = true;
    if (!primeira && !prazosAntes[s.solicitacao_id]) avisos.push(s.nome + ' pediu mais tempo para fazer o pedido');
  });
  aoVivo.prazos = prazosAgora;

  atualizarPendencias(resposta.resumo.pendentes + (resposta.resumo.prazos_pendentes || []).length);

  if (avisos.length) {
    avisos.slice(0, 3).forEach(function(texto) { avisar(texto); });
    if (avisos.length > 3) avisar('E mais ' + (avisos.length - 3) + ' novidade(s) nos pedidos.');
    tocarAviso();
  }

  if (primeira) return;

  // Tela inicial: atualiza o cartão "Pedidos de hoje"
  if (typeof resumoAdmin !== 'undefined' && resumoAdmin) resumoAdmin.pedidos = resposta.resumo;
  if (estado.telaAtual === 'inicio-admin') renderizarPedidosHojeAdmin(resposta.resumo);

  // Tela de pedidos aberta no dia de hoje: busca a lista nova
  const hoje = hojeTexto();
  if (estado.telaAtual === 'pedidos' && pedidosAdmin.data === hoje) {
    buscarPedidosDia(hoje, true);
  } else {
    delete pedidosAdmin.dias[hoje];
  }
}

function atualizarPendencias(quantidade) {
  marcarContadorMenu('pedidos', quantidade || 0);
  estado.pendenciasTitulo = quantidade || 0;
  definirTitulo();
}

function somLigado() {
  return lerPermanente('som_pedidos') !== 'nao';
}

function tocarAviso() {
  if (!somLigado() || !aoVivo.audio) return;

  try {
    const contexto = aoVivo.audio;
    if (contexto.state === 'suspended') contexto.resume();

    [[784, 0], [1047, 0.18]].forEach(function(nota) {
      const oscilador = contexto.createOscillator();
      const volume = contexto.createGain();
      const inicio = contexto.currentTime + nota[1];
      oscilador.type = 'sine';
      oscilador.frequency.value = nota[0];
      volume.gain.setValueAtTime(0.0001, inicio);
      volume.gain.exponentialRampToValueAtTime(0.3, inicio + 0.02);
      volume.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.35);
      oscilador.connect(volume);
      volume.connect(contexto.destination);
      oscilador.start(inicio);
      oscilador.stop(inicio + 0.4);
    });
  } catch (erro) { /* sem som */ }
}

function criarBotaoSom() {
  const botao = el('button', 'botao-icone botao-som');
  botao.type = 'button';

  function desenhar() {
    const ligado = somLigado();
    botao.innerHTML = icone(ligado ? 'som' : 'semSom');
    botao.title = ligado ? 'Aviso sonoro de novos pedidos: ligado' : 'Aviso sonoro de novos pedidos: desligado';
    botao.classList.toggle('desligado', !ligado);
  }

  botao.addEventListener('click', function() {
    guardarPermanente('som_pedidos', somLigado() ? 'nao' : 'sim');
    desenhar();
    if (somLigado()) tocarAviso();
    avisar(somLigado() ? 'Aviso sonoro ligado.' : 'Aviso sonoro desligado.');
  });

  desenhar();
  return botao;
}

function criarIndicadorAoVivo() {
  const indicador = el('span', 'ao-vivo');
  indicador.id = 'indicadorAoVivo';
  indicador.appendChild(el('span', 'ao-vivo-ponto'));
  indicador.appendChild(el('span', '', 'Ao vivo'));
  indicador.title = 'Os pedidos novos aparecem sozinhos, sem precisar atualizar a página.';
  return indicador;
}

function atualizarIndicadorAoVivo(conectado) {
  const indicador = document.getElementById('indicadorAoVivo');
  if (!indicador) return;
  indicador.classList.toggle('sem-conexao', !conectado);
  indicador.lastChild.textContent = conectado ? 'Ao vivo' : 'Reconectando…';
}

// ---------- EMPRESA ----------
function receberNovidadesEmpresa(resposta, primeira) {
  const atual = resposta.pedido_hoje;
  const antes = aoVivo.pedidoEmpresa;
  aoVivo.pedidoEmpresa = atual;

  if (primeira || !antes) return;

  const situacaoPrazo = function(r) { return r.prazo_extra ? r.prazo_extra.status + ':' + (r.prazo_extra.liberado_ate || '') : ''; };
  const chave = function(r) { return [r.pedido_id, r.status, r.quantidade, r.atualizado_em, r.confirmado_em, situacaoPrazo(r)].join('|'); };
  if (chave(antes) === chave(atual)) return;

  if (situacaoPrazo(atual) !== situacaoPrazo(antes) && atual.prazo_extra) {
    if (atual.prazo_extra.status === 'LIBERADO') {
      avisar('O restaurante liberou mais prazo: você pode enviar ou alterar o pedido até ' + atual.prazo_extra.liberado_ate_texto + '.');
    } else if (atual.prazo_extra.status === 'RECUSADO') {
      avisar('O restaurante não liberou mais prazo' + (atual.prazo_extra.resposta ? ': ' + atual.prazo_extra.resposta : '.'), 'erro');
    }
  }

  if (atual.status !== antes.status || atual.confirmado_em !== antes.confirmado_em) {
    if (atual.status === 'CONFIRMADO') {
      avisar('O restaurante confirmou o seu pedido de hoje.');
    } else if (atual.status === 'RECUSADO') {
      avisar('O restaurante recusou o seu pedido' +
        (atual.resposta_restaurante ? ': ' + atual.resposta_restaurante : '.'), 'erro');
    }
  }

  if (typeof resumoEmpresa !== 'undefined' && resumoEmpresa) resumoEmpresa.pedido_hoje = atual;
  if (estado.telaAtual === 'inicio-empresa') renderizarPedidoHojeEmpresa(atual);

  // Só recarrega a tela do pedido se a pessoa não estiver no meio de uma alteração
  if (estado.telaAtual === 'pedidos-empresa' && !pedidoEmpresa.alterado && $('modalFundo').hidden) {
    carregarPedidoEmpresa();
  }
}
