    { titulo: 'Olá! Seja bem-vindo!', texto: 'Este é o sistema de pedidos de quentinhas do Tempero de Mãe. Vou te mostrar como funciona, é bem rápido.' },
    { tela: 'inicio-empresa', titulo: 'Início', texto: 'Aqui você vê o cardápio de hoje, até que horas dá para pedir e como está o seu pedido.' },
    { tela: 'funcionarios-empresa', titulo: 'Funcionários', texto: 'Cadastre os funcionários da empresa uma vez só. Depois, no dia a dia, é só escolher quem vai almoçar.' },
    { tela: 'cardapio-empresa', titulo: 'Cardápio', texto: 'Veja o cardápio da semana inteira, publicado pelo restaurante.' },
    { tela: 'pedidos-empresa', titulo: 'Pedido de hoje', texto: 'Marque os funcionários, escolha a proteína de cada um e envie até o horário limite. Dá para alterar enquanto o prazo estiver aberto. Perdeu o horário? Peça mais 30 minutos ao restaurante.' },
    { tela: 'cobrancas-empresa', titulo: 'Cobranças', texto: 'Acompanhe as cobranças, os valores e as datas de vencimento.' },
    { titulo: 'Pronto!', texto: 'Para rever este tutorial, abra o menu da sua conta e clique em "Rever tutorial". Bom apetite!' }
  ]
};

let tutorial = null;   // { passos, indice, raiz, telaAntes }

function passosDoTutorial() {
  const ids = itensDoMenu().map(function(i) { return i.id; });
  return (PASSOS_TUTORIAL[estado.usuario.perfil] || []).filter(function(p) {
    return !p.tela || ids.indexOf(p.tela) !== -1;
  });
}

function abrirTutorial() {
  if (!estado.usuario || tutorial) return;
  $('menuConta').hidden = true;
  fecharMenuCelular();

  const passos = passosDoTutorial();
  if (!passos.length) return;

  const raiz = el('div', 'tutorial');
  raiz.setAttribute('role', 'dialog');
  raiz.setAttribute('aria-modal', 'true');
  raiz.setAttribute('aria-labelledby', 'tutorialTitulo');
  raiz.innerHTML =
    '<div class="tutorial-holofote"></div>' +
    '<div class="tutorial-caixa">' +
      '<img class="tutorial-personagem" alt="" src="' + PERSONAGEM_TUTORIAL + '">' +
      '<div class="tutorial-balao">' +
        '<span class="tutorial-passo"></span>' +
        '<h2 id="tutorialTitulo"></h2>' +
        '<p class="tutorial-texto"></p>' +
        '<div class="tutorial-pontos" aria-hidden="true"></div>' +
        '<div class="tutorial-acoes">' +
          '<button type="button" class="tutorial-pular"><span class="tutorial-pular-longo">Pular tutorial</span><span class="tutorial-pular-curto">Pular</span></button>' +
          '<button type="button" class="botao botao-secundario tutorial-voltar">Voltar</button>' +
          '<button type="button" class="botao botao-primario tutorial-proximo">Próximo</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(raiz);

  tutorial = { passos: passos, indice: 0, raiz: raiz, telaAntes: estado.telaAtual };

  raiz.querySelector('.tutorial-pular').addEventListener('click', function() { fecharTutorial(); });
  raiz.querySelector('.tutorial-voltar').addEventListener('click', function() { irParaPassoTutorial(tutorial.indice - 1); });
  raiz.querySelector('.tutorial-proximo').addEventListener('click', function() {
    if (tutorial.indice >= tutorial.passos.length - 1) fecharTutorial();
    else irParaPassoTutorial(tutorial.indice + 1);
  });

  document.addEventListener('keydown', teclaTutorial);
  window.addEventListener('resize', posicionarHolofote);
  irParaPassoTutorial(0);
}

function teclaTutorial(evento) {
  if (!tutorial) return;
  if (evento.key === 'Escape') { evento.preventDefault(); fecharTutorial(); }
  if (evento.key === 'ArrowRight') { evento.preventDefault(); tutorial.raiz.querySelector('.tutorial-proximo').click(); }
  if (evento.key === 'ArrowLeft' && tutorial.indice > 0) { evento.preventDefault(); irParaPassoTutorial(tutorial.indice - 1); }
}

function irParaPassoTutorial(indice) {
  if (!tutorial) return;
  const passos = tutorial.passos;
  tutorial.indice = Math.max(0, Math.min(indice, passos.length - 1));
  const passo = passos[tutorial.indice];
  const raiz = tutorial.raiz;
  const ultimo = tutorial.indice === passos.length - 1;

  raiz.querySelector('.tutorial-passo').textContent = 'Passo ' + (tutorial.indice + 1) + ' de ' + passos.length;
  raiz.querySelector('#tutorialTitulo').textContent = passo.titulo;
  raiz.querySelector('.tutorial-texto').textContent = passo.texto;
  raiz.querySelector('.tutorial-voltar').hidden = tutorial.indice === 0;
  raiz.querySelector('.tutorial-pular').hidden = ultimo;
  raiz.querySelector('.tutorial-proximo').textContent = tutorial.indice === 0 ? 'Vamos lá' : (ultimo ? 'Começar a usar' : 'Próximo');

  const pontos = raiz.querySelector('.tutorial-pontos');
  pontos.innerHTML = '';
  passos.forEach(function(p, i) { pontos.appendChild(el('span', i === tutorial.indice ? 'ativo' : '')); });

  // Leva à tela do passo (aparece por trás, escurecida)
  if (passo.tela && estado.telaAtual !== passo.tela) irPara(passo.tela);

  // Pequena animação a cada passo
  const caixa = raiz.querySelector('.tutorial-caixa');
  caixa.classList.remove('trocando');
  void caixa.offsetWidth;
  caixa.classList.add('trocando');

  setTimeout(posicionarHolofote, 60);
  setTimeout(function() { if (tutorial) raiz.querySelector('.tutorial-proximo').focus({ preventScroll: true }); }, 80);
}

// Item do menu visível na tela para o passo atual
function alvoDoTutorial(passo) {
  if (!passo || !passo.tela) return null;
  const itens = Array.prototype.slice.call(document.querySelectorAll('[data-tela="' + passo.tela + '"]'));
  return itens.find(function(item) {
    const r = item.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && r.right > 0 && r.left < window.innerWidth && r.bottom > 0 && r.top < window.innerHeight;
  }) || null;
}

function posicionarHolofote() {
  if (!tutorial) return;
  const holofote = tutorial.raiz.querySelector('.tutorial-holofote');
  const alvo = alvoDoTutorial(tutorial.passos[tutorial.indice]);

  if (!alvo) {
    holofote.classList.remove('com-alvo');
    holofote.style.cssText = 'top:50%;left:50%;width:0;height:0;';
    return;
  }

  const r = alvo.getBoundingClientRect();
  const folga = 6;
  holofote.classList.add('com-alvo');
  holofote.style.cssText = 'top:' + (r.top - folga) + 'px;left:' + (r.left - folga) + 'px;width:' +
    (r.width + folga * 2) + 'px;height:' + (r.height + folga * 2) + 'px;';
}

// Fecha o tutorial. Marca como visto no servidor (não abre sozinho de novo),
// a menos que semMarcar seja true (ex.: a sessão terminou no meio).
function fecharTutorial(semMarcar) {
  if (!tutorial) return;
  const atual = tutorial;
  tutorial = null;
  document.removeEventListener('keydown', teclaTutorial);
  window.removeEventListener('resize', posicionarHolofote);
  atual.raiz.classList.add('saindo');
  setTimeout(function() { atual.raiz.remove(); }, 220);

  if (semMarcar) return;

  if (estado.usuario) {
    estado.usuario.tutorial_visto = true;
    const primeira = itensDoMenu()[0];
    if (primeira && estado.telaAtual !== primeira.id) irPara(primeira.id);
  }
  apiSessao('marcarTutorialVisto').catch(function() {});
}

// Abre sozinho no primeiro acesso (o restaurante no modo teste não precisa;
// já "Ver como empresa" mostra o tutorial da empresa, bom para apresentar)
AO_ENTRAR.push(function(dados, usuario) {
  if (window.__semTutorial) return;   // usado só pelos testes automáticos
  if (usuario.tutorial_visto) return;
  if (usuario.modo_teste && usuario.perfil === 'admin') return;
  setTimeout(function() {
    if (estado.usuario === usuario && !tutorial && !$('app').hidden) abrirTutorial();
  }, 900);
});
</script>
