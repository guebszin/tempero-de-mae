// Recorte do símbolo (ramos de trigo) dentro da logo, em pixels
const RECORTE_SIMBOLO = { x: 52, y: 0, largura: 208, altura: 132, esmaecer: 9 };

let logoSimbolo = '';

function recortarSimbolo(imagem) {
  const r = RECORTE_SIMBOLO;
  const tela = document.createElement('canvas');
  tela.width = r.largura;
  tela.height = r.altura;
  const contexto = tela.getContext('2d');
  contexto.drawImage(imagem, r.x, r.y, r.largura, r.altura, 0, 0, r.largura, r.altura);

  // Esmaece a borda de baixo (onde os caules continuam na logo)
  contexto.globalCompositeOperation = 'destination-out';
  const degrade = contexto.createLinearGradient(0, r.altura - r.esmaecer, 0, r.altura);
  degrade.addColorStop(0, 'rgba(0,0,0,0)');
  degrade.addColorStop(1, 'rgba(0,0,0,1)');
  contexto.fillStyle = degrade;
  contexto.fillRect(0, r.altura - r.esmaecer, r.largura, r.esmaecer);
  return tela.toDataURL('image/png');
}

function aplicarLogos(raiz) {
  (raiz || document).querySelectorAll('img[data-logo]').forEach(function(img) {
    if (img.dataset.logo !== 'simbolo') {
      img.src = LOGO_COMPLETO;
    } else if (logoSimbolo) {
      img.src = logoSimbolo;
    }
  });
}

// Logo pequena para o cabeçalho das impressões (PDF)
function logoImpressao() {
  const img = document.createElement('img');
  img.className = 'imp-logo';
  img.src = LOGO_COMPLETO;
  img.alt = 'Tempero de Mãe';
  return img;
}

(function() {
  aplicarLogos();
  const imagem = new Image();
  imagem.onload = function() {
    try { logoSimbolo = recortarSimbolo(imagem); } catch (erro) { logoSimbolo = LOGO_COMPLETO; }
    aplicarLogos();
  };
  imagem.src = LOGO_COMPLETO;
})();
